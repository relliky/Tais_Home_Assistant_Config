template:
  - sensor:
      - name: "Vacuum Robot X1 Error State"
        state: >
          {% if is_state('sensor.x1_error', '0') or is_state('sensor.x1_error', 'Unknown') or is_state('sensor.x1_error', 'unknown')  %}
              Normal
          {% elif is_state('sensor.x1_error', '301') %}
              扫地机器人清水用完了。请加清水和倒掉污水。Clean Water in the Vacuum Robot Dock Has Run Out. Please refill clean water tank and empty the dirty water tank.
          {% elif is_state('sensor.x1_error', '302') %}
              扫地机器人污水箱已满。Dirty water tank in the vacuum robot dock has been full.
          {% elif is_state('sensor.x1_error', '103') %}
              驱动轮困难，请把扫地机器人移到别的地方。Vacuum robot wheel got stuck, please move it to other places.
          {% elif is_state('sensor.x1_error', '109') %}
              滚刷被缠绕，请解救扫地机器人。Vacuum robot got stuck, please untangle it。
          {% else %}
              扫地机器人发生不明错误，请查看。Vacuum Robot has unknown error. Please check if it's working ok.
          {% endif %}

# Ecovacs X1 battery sensor
  - sensor:
      - name: "X1 Battery"
        state: "{{ state_attr('vacuum.x1', 'battery_level') }}"
        unit_of_measurement: "%"

automation errors:
  - alias: VN-KC Notify Vacuum Robot Error
    id: nvdiasojfoewnfdjsaf
    mode: single
    trigger:
      - platform: state
        entity_id:
          #- group.kitchen_motion_group
          - group.living_room_motion_group
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.vacuum_robot_x1_error_state
            state: "Normal"
    action:
      - service: script.notify_alexa_speakers_and_phones
        data:
          tts_message: "{{states('sensor.vacuum_robot_x1_error_state')}}"
          notify_tai: "yes"
          #notify_guest_room_tenant: "yes"
          #notify_en_suite_room_tenant: "yes"
          #notify_ke_ba_ba: "yes"
          #notify_ke_ma_ma: "yes"
          notify_ke: "yes"
          alexa_speaker_list:
            #- media_player.kitchen_echo
            - media_player.living_room_echo
      - delay: "04:00:00"

  - alias: V-KC Ask Vaccum X1 To Return To Dock If Stuck
    id: 3902jgfrngfd89bvfdsjkfdjiafuew
    description: ""
    trigger:
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: vacuum.x1
            state: idle
            for: "00:05:00"
          - condition: state
            entity_id: vacuum.x1
            state: unknown
            for: "00:05:00"
          - condition: state
            entity_id: vacuum.x1
            state: paused
            for: "00:05:00"
          - condition: state
            entity_id: vacuum.x1
            state: unavailable
            for: "00:05:00"
          - condition: state
            entity_id: vacuum.x1
            state: returning
            for: "00:05:00"
    action:
      - service: vacuum.return_to_base
        data: {}
        target:
          entity_id: vacuum.x1
    mode: single

