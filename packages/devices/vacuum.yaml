script button:
  ask_vacuum_to_clean_kitchen:
    alias: Ask Vacuum To Clean Kitchen
    sequence:
    - service: vacuum.send_command
      target:
        entity_id: vacuum.x1
      data:
        command: spot_area
        params:
          rooms: 0
          cleanings: 1

  ask_vacuum_to_clean_living_room:
    alias: Ask Vacuum To Clean Living Room
    sequence:
    - service: vacuum.send_command
      target:
        entity_id: vacuum.x1
      data:
        command: spot_area
        params:
          rooms: 2
          cleanings: 1

  ask_vacuum_to_start:
    alias: Ask Vacuum To Start
    sequence:
    - action: vacuum.start
      target:
        entity_id: vacuum.x1

  ask_vacuum_to_return_to_base:
    alias: Ask Vacuum To Return To Base
    sequence:
    - service: vacuum.stop
      target:
        entity_id: vacuum.x1
    - delay: "00:00:01"
    - service: vacuum.return_to_base
      target:
        entity_id: vacuum.x1

automation button:
  - alias: VB-KC Kitchen Vacuum start by Pressing the button
    id: 3492849032uriojewjfreau8fef
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.18c23c246426_action # kitchen
        to: hold
        id: KITCHEN
      - platform: state
        entity_id:
          - sensor.18c23c2826fc_action # living room
        to: hold
        id: LIVING_ROOM
    condition: []
    action:
      - if:
          - condition: state
            entity_id: vacuum.x1
            state: cleaning
        then:
          - service: script.ask_vacuum_to_return_to_base
        else:
          # Clean
          choose:
          - conditions:
            - condition: trigger
              id: KITCHEN
            sequence:
            - service: script.ask_vacuum_to_start
          - conditions:
            - condition: trigger
              id: LIVING_ROOM
            sequence:
            - service: script.ask_vacuum_to_clean_living_room


