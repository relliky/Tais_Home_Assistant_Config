script:
  do_nothing:
    alias: Do nothing
    sequence:

  restart_ha:
    alias: Restart HA
    sequence:
      - service: homeassistant.restart


automation ping:
  - alias: Ping 8_8_8_8 every second
    id: "16027224527fjdklasfldasjkf376"
    description: ""
    trigger:
      - platform: time_pattern
        seconds: "/5"
    action:
      - service: homeassistant.update_entity
        entity_id: binary_sensor.8_8_8_8


###############################################
#
# Automations:
# - Non-bedroom light colour design
# - Restart HA on time
# - Log Enable
#
###############################################
automation:
  - alias: Do nothing
    id: "1596919926917"
    trigger: []
    action: []

  # All living room Router/AP/Hubs (tado/hue/LR gateway 3/Xiaomi AP)
  # will be restart at 4.30am by a timer plug.
  # HA instance and other AP/hubs (AQ/MR gateway/TPlink AP) will be
  # restarted by the instance below.
  #
  # WOL sometimes stuck at sending magic packets and required to restart HA
  - alias: Restart HA at midnight
    id: "1602722452776"
    description: ""
    trigger:
      - at: 03:01:00
        platform: time
    action:
      - service: homeassistant.restart

  - alias: Restart addons at midnight
    id: "1602722452432423342532"
    description: ""
    trigger:
      - at: 04:10:00
        platform: time
    action:
      # restart Z2M to reduce the chance of experiencing pairing devices accidentally
      - service: hassio.addon_restart
        data:
          addon: 8c77aaed_zigbee2mqtt
      - delay: 00:01:00
      #- service: hassio.addon_restart
      #  data:
      #    addon: a0d7b954_vscode
      #- delay: 00:01:00
      # Restart HA
      # Generate report
      #- service: watchman.report
      # Restart hubs in other rooms

      # Stop VS Code to save memory
      #- service: hassio.addon_stop
      #  data:
      #    addon: a0d7b954_vscode
      #- delay: "00:01:00"

  # - Starts Log Enable and set timeout
  - alias: Enable/Disable Logging By The State of The Log Enable
    id: "1607918439986"
    trigger:
      - platform: state
        entity_id: input_boolean.log_enable
        to:
          - "on"
          - "off"
    action:
      # Reset the Timer
      - service: input_datetime.set_datetime
        entity_id: input_datetime.log_disable_time
        data_template:
          datetime: "{{ (now().timestamp())| timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}"
      # IF log_enable is ON
      - condition: state
        entity_id: input_boolean.log_enable
        state: "on"
      # Make the timeout to 1 day later
      - service: input_datetime.set_datetime
        entity_id: input_datetime.log_disable_time
        data_template:
          datetime: "{{ (now().timestamp() + 60*60*24)| timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}"
      # Enable/Disable recorder
      - delay: '00:00:10'
      - service: >
          {% if states('input_boolean.log_enable') == 'on' %}
            recorder.enable
          {% else %}
            recorder.disable
          {% endif %}

