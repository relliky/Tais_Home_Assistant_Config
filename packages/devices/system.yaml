# Remote Acccess via HTTP and using NGINX for HTTPS, this works on multiple DDNS providers with SSL, such as DuckDNS + synology
http:
  #ip_ban_enabled: true
  #login_attempts_threshold: 9999
  use_x_frame_options: false
  # Use reverse proxy
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.1.0/24  # Main network
    - 192.168.4.0/24  # Isolated network
    - 172.30.33.0/24  # use for HAOS docker IPs etc - NGINX addon required
    - 172.17.0.0/24
    - 127.0.0.0/24


script system:
  reload_autogen_entity:
    alias: Reload Auto-generated Entities # take about 12 seconds
    sequence:
      - service: min_max.reload
      - service: filter.reload
      - service: trend.reload
      - service: input_boolean.reload
      - service: input_select.reload
      - service: input_number.reload
      - service: input_datetime.reload
      - service: history_stats.reload
      - service: timer.reload
      - service: script.reload
      - service: automation.reload
      - service: group.reload
      - service: template.reload

# System Sensors
sensor:
  # Time
  - platform: time_date
    display_options:
      - "time"
      - "date"

# Custom Variables
input_boolean:
  log_enable:
    name: "Log Enable"
    initial: 'on'

  always_off_constant:
    name: "Always Off Constant"
    initial: "off"

  always_on_constant:
    name: "Always On Constant"
    initial: "on"

  placeholder:
    name: "Placeholder"
    initial: "off"


automation placeholder:
  - alias: H- Always Turn Off Placeholder Input Boolean
    id: "167906535942ffdsafdsafdsfds1"
    trigger:
      - entity_id: input_boolean.placeholder
        platform: state
    action:
      - delay: '00:00:01'
      - service: homeassistant.turn_off
        entity_id: input_boolean.placeholder

input_select:
  indoor_brightness:
    name: Indoor Brightness
    options:
      - dark
      - dimmed
      - bright

automation indoor_brightness:
  - alias: L- Set up Indoor Brightness Based On Sun
    id: "1679065359421"
    trigger:
      - entity_id: sun.sun
        platform: state
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.indoor_brightness
        data:
          option: >
            {% if states('sun.sun') == 'below_horizon' %}
              dark
            {% else %}
              bright
            {% endif %}

