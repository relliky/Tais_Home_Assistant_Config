sensor:
  - platform: filter
    name: "Living Room East Side Light 15 Min Moving Average"
    entity_id: sensor.living_room_east_side_light_sensor
    filters:
      # 1. Outlier filter: Drops extreme spikes that deviate too fast from the median
      - filter: outlier
        window_size: 5
        radius: 20000
      # 2. Moving Average: Smooths the remaining data over a rolling 15-minute window
      - filter: time_simple_moving_average
        window_size: "00:15:00"
        precision: 0

