template:
  - binary_sensor:
      - name: "TAIS PC Sleep Blocked"
        unique_id: tais_pc_sleep_blocked
        state: "{{ states('sensor.tais_pc_satellite_tais_pc_power_sleep_block_state') == 'blocked' }}"
        availability: >-
          {{ states('sensor.tais_pc_satellite_tais_pc_power_sleep_block_state') not in ['unknown', 'unavailable', 'error_during_execution', ''] }}
        attributes:
          requests: "{{ states('sensor.tais_pc_satellite_tais_pc_power_sleep_block_details') }}"
          source_state_sensor: sensor.tais_pc_satellite_tais_pc_power_sleep_block_state
          source_details_sensor: sensor.tais_pc_satellite_tais_pc_power_sleep_block_details
          source: "powercfg /requests"
        icon: >-
          {% if states('sensor.tais_pc_satellite_tais_pc_power_sleep_block_state') == 'blocked' %}
            mdi:sleep-off
          {% else %}
            mdi:sleep
          {% endif %}
