            - if:
                condition: state
                entity_id: input_boolean.curtain_control_moderate_light_outdoor_corridor
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
      else:
        alias: If it is low light outdoor
        if:
        - condition: template
          value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) <= states(''input_number.intensity_threshold_moderate_light_outdoor_corridor'') | float(0) }}'
        - condition: state
          entity_id:
          - switch.adaptive_lighting_sleep_mode_corridor_first_floor
          - switch.adaptive_lighting_sleep_mode_corridor_ground_floor
          state: 'off'
        then:
