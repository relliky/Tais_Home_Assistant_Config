              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_low_light_outdoor_corridor
                  state: 'on'
                then:
                  service: script.do_nothing
                else:
                  service: script.do_nothing
        else:
          alias: If it is sleep mode
          if:
          - condition: state
            entity_id:
            - switch.adaptive_lighting_sleep_mode_corridor_first_floor
            - switch.adaptive_lighting_sleep_mode_corridor_ground_floor
            state: 'on'
          then:
            alias: curtain states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.curtain_control_sleep_mode_corridor
                    state: 'on'
