  - name: Corridor Unavailable Entities
    state: '{% set added_device_entities =  [''sensor.front_doorbell_ring_battery'', ''sensor.ground_corridor_motion_sensor_1_battery'', ''sensor.ground_corridor_motion_sensor_2_battery'', ''sensor.first_corridor_motion_sensor_1_battery'', ''sensor.first_corridor_motion_sensor_2_battery'', ''sensor.ground_corridor_wall_button'', ''sensor.first_corridor_wall_button'', ''sensor.corridor_tado_availiabity'', ''binary_sensor.corridor_heating_required'', ''binary_sensor.ground_corridor_motion_sensor_motion_1'', ''binary_sensor.ground_corridor_motion_sensor_motion_2'', ''binary_sensor.first_corridor_motion_sensor_motion_1'', ''binary_sensor.first_corridor_motion_sensor_motion_2'', ''switch.ground_corridor_wall_switch_1'', ''switch.ground_corridor_wall_switch_2'', ''switch.first_corridor_wall_switch_1'', ''switch.first_corridor_wall_switch_2'', ''switch.downstairs_heating'', ''switch.water_heater'', ''switch.upstairs_heating'', ''light.corridor_ceiling_light'', ''light.first_corridor_light'', ''light.ground_corridor_light''] %}{% set ns = namespace() %}{% set ns.num_unavail_devices = 0 %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}      {% set ns.num_unavail_devices = ns.num_unavail_devices + 1 %}   {% endif %}{% endfor %}{% if ns.num_unavail_devices > 0%}  on  {% else %}  off {% endif %}'
    attributes:
      value: '{% set added_device_entities =  [''sensor.front_doorbell_ring_battery'', ''sensor.ground_corridor_motion_sensor_1_battery'', ''sensor.ground_corridor_motion_sensor_2_battery'', ''sensor.first_corridor_motion_sensor_1_battery'', ''sensor.first_corridor_motion_sensor_2_battery'', ''sensor.ground_corridor_wall_button'', ''sensor.first_corridor_wall_button'', ''sensor.corridor_tado_availiabity'', ''binary_sensor.corridor_heating_required'', ''binary_sensor.ground_corridor_motion_sensor_motion_1'', ''binary_sensor.ground_corridor_motion_sensor_motion_2'', ''binary_sensor.first_corridor_motion_sensor_motion_1'', ''binary_sensor.first_corridor_motion_sensor_motion_2'', ''switch.ground_corridor_wall_switch_1'', ''switch.ground_corridor_wall_switch_2'', ''switch.first_corridor_wall_switch_1'', ''switch.first_corridor_wall_switch_2'', ''switch.downstairs_heating'', ''switch.water_heater'', ''switch.upstairs_heating'', ''light.corridor_ceiling_light'', ''light.first_corridor_light'', ''light.ground_corridor_light''] %}{% set ns = namespace() %}{% set ns.unavail_devices = '''' %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}   {% set ns.unavail_devices = ns.unavail_devices + ''

        '' +device %} {% endif %}{% endfor %}{{ns.unavail_devices}}'
