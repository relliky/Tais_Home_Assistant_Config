template:
- binary_sensor:
  - name: Whole Home Unavailable Entities
    state: '{% set added_device_entities =  [] %}{% set ns = namespace() %}{% set ns.num_unavail_devices = 0 %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}      {% set ns.num_unavail_devices = ns.num_unavail_devices + 1 %}   {% endif %}{% endfor %}{% if ns.num_unavail_devices > 0%}  on  {% else %}  off {% endif %}'
    attributes:
      value: '{% set added_device_entities =  [] %}{% set ns = namespace() %}{% set ns.unavail_devices = '''' %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}   {% set ns.unavail_devices = ns.unavail_devices + ''

        '' +device %} {% endif %}{% endfor %}{{ns.unavail_devices}}'
- binary_sensor:
  - name: Whole Home Low Battery
    state: '{% set state = states("sensor.whole_home_min_battery") %} {% if state == "unavailable" or state == "unknown" or int(state) > 20 %} off {% else%} on {% endif %}'
