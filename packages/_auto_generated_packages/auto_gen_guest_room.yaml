            entity_id:
            - cover.guest_room_curtain
          - service: cover.set_cover_position
            target:
              entity_id:
              - cover.guest_room_curtain
            data:
              position: '{{ [[ (state_attr(''cover.guest_room_curtain'', ''current_position'')) + 34 ,0]|max,100]|min}}'
    - conditions:
      - condition: trigger
        id: DECREMENT_CURTAINS
