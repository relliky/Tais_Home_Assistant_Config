    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_on
      entity_id: switch.0x00158d00047b69d2_switch
  mode: queued
  id: automation.zlb_gr_flex_wall_switch_on_postion_1_automatically_turn_on_the_wall_switch_back_when_turned_off_guest_room
- alias: ZH-GR Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-Guest Room
  triggers:
  - trigger: state
    entity_id: input_boolean.guest_room_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va1049826304
    attribute: temperature
  - minutes: /30
    seconds: '42'
    platform: time_pattern
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.guest_room_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.guest_room'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va1049826304'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va1049826304
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va1049826304
  id: automation.zh_gr_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_guest_room
- alias: ZL-GR Lights and Curtain On If Entering to Room-Guest Room
  id: automation.zl_gr_lights_and_curtain_on_if_entering_to_room_guest_room
  trigger:
    entity_id:
    - binary_sensor.guest_room_entrance_motion_sensor_motion
    platform: state
    to: 'on'
  action:
  - service: automation.turn_off
    entity_id: automation.zl_gr_lights_and_curtain_on_if_entering_to_room_guest_room
