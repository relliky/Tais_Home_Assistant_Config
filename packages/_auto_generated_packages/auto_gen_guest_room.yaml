          entity_id: sun.sun
          state: above_horizon
        - condition: state
          entity_id: sun.sun
          state:
          - unavailable
          - unknown
      - condition: time
        after: input_datetime.morning_start_time_guest_room
        before: input_datetime.morning_end_time_guest_room
    then:
      alias: States when bright morning
      if:
      - '{{ 1 == 1 }}'
