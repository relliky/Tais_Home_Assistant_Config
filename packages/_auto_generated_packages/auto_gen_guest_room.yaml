      stop_actions: false
  - service: script.call_room_scene
    data:
      room_scene_select: input_select.guest_room_scene
      scene: Idle
  - alias: If it is bright morning
    if:
    - alias: Bright morning
      condition: and
      conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.living_room_east_side_light_sensor
          above: input_number.guest_room_min_value_as_bright
        - condition: state
          entity_id: sensor.living_room_east_side_light_sensor
