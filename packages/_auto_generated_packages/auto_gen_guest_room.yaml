- alias: ZOc-GR Occupancy Update-Guest Room
  id: automation.zoc_gr_occupancy_update_guest_room
  trigger:
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - minutes: /5
    seconds: '19'
    platform: time_pattern
  action:
