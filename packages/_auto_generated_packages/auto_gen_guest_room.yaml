                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.guest_room_curtain
                  - service: cover.close_cover
                    entity_id:
                    - cover.guest_room_curtain
      else:
        alias: If it is dark
        if:
        - alias: Bright afternoon
          condition: and
          conditions:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.living_room_east_side_light_sensor
              above: input_number.guest_room_min_value_as_bright
            - condition: state
              entity_id: sensor.living_room_east_side_light_sensor
              state:
              - unavailable
              - unknown
          - condition: or
            conditions:
            - condition: state
              entity_id: sun.sun
              state: above_horizon
            - condition: state
              entity_id: sun.sun
              state:
              - unavailable
              - unknown
          - condition: time
            after: input_datetime.afternoon_start_time_guest_room
            before: input_datetime.afternoon_end_time_guest_room
        then:
          alias: States when left in bright afternoon
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_bright_afternoon_when_left_guest_room
                  state: 'on'
                then:
                  alias: Turn cover.guest_room_curtain state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.guest_room_curtain
                    - service: cover.open_cover
                      entity_id:
                      - cover.guest_room_curtain
                else:
                  alias: Turn cover.guest_room_curtain state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.guest_room_curtain
                    - service: cover.close_cover
                      entity_id:
                      - cover.guest_room_curtain
        else:
          alias: States when left in dark
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_dark_when_left_guest_room
                  state: 'on'
                then:
                  alias: Turn cover.guest_room_curtain state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.guest_room_curtain
                    - service: cover.open_cover
                      entity_id:
                      - cover.guest_room_curtain
                else:
                  alias: Turn cover.guest_room_curtain state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.guest_room_curtain
                    - service: cover.close_cover
                      entity_id:
                      - cover.guest_room_curtain
    - service: script.do_nothing
    - alias: All Off
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - alias: Turn light.guest_room_ceiling_light state=off
          if:
          - '{{ 1 == 1 }}'
          then:
