      - alias: Turn heating state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id: climate.guest_room
            state: 'off'
          then:
            alias: Turn heating state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.guest_room state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: heat
                  entity_id: climate.guest_room
              - alias: Turn switch.schedule_guest_room_temperature state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id: switch.schedule_guest_room_temperature
          else:
            alias: Turn heating state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.guest_room state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: 'off'
                  entity_id: climate.guest_room
              - alias: Turn switch.schedule_guest_room_temperature state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id: switch.schedule_guest_room_temperature
    - conditions:
        condition: trigger
        id: INCREMENT_HEATING
      sequence:
      - alias: Turn heating state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.guest_room
          data:
            temperature: '{{ (state_attr(''climate.guest_room'', ''temperature'')) + 1}}'
    - conditions:
        condition: trigger
        id: DECREMENT_HEATING
      sequence:
      - alias: Turn heating state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.guest_room
          data:
            temperature: '{{ (state_attr(''climate.guest_room'', ''temperature'')) + -1}}'
  id: automation.zlb_gr_eight_key_knob_control_guest_room
- alias: ZL-GR Applies Different Scenes Based on Scene Selections (State Execution)-Guest Room
  trigger:
  - platform: state
    entity_id: input_select.guest_room_scene
  mode: restart
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: All White
      sequence:
        alias: All White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.guest_room_lamp state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_lamp
          - alias: Turn light.guest_room_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_ceiling_light
          - alias: Turn light.guest_room_desk_screen_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_desk_screen_led
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Ceiling Light White
      sequence:
        alias: Ceiling Light White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.guest_room_lamp state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_lamp
          - alias: Turn light.guest_room_desk_screen_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_desk_screen_led
          - alias: Turn light.guest_room_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_ceiling_light
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Lamp LED White
      sequence:
        alias: Lamp LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.guest_room_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_ceiling_light
          - alias: Turn light.guest_room_lamp state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_lamp
          - alias: Turn light.guest_room_desk_screen_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_desk_screen_led
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: LED White
      sequence:
        alias: LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.guest_room_desk_screen_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.guest_room_desk_screen_led
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Hue
      sequence:
        alias: Hue
        if:
        - '{{ 1 == 1 }}'
        then:
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - light.guest_room_lamp
            - light.guest_room_ceiling_light
            - light.guest_room_desk_screen_led
            state: 'off'
            rgb: non_rgb_only
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - light.guest_room_lamp
            - light.guest_room_ceiling_light
            - light.guest_room_desk_screen_led
        - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Night Mode
      sequence:
        alias: Night Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.guest_room_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Dark Night Mode
      sequence:
        alias: Dark Night Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.guest_room_dark_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: Sleep Mode
      sequence:
        alias: Sleep Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.guest_room_sleep_mode
    - conditions:
      - condition: state
        entity_id: input_select.guest_room_scene
        state: All Off
      sequence:
        alias: All Off
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.guest_room_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_ceiling_light
          - alias: Turn light.guest_room_lamp state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_lamp
          - alias: Turn light.guest_room_desk_screen_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.guest_room_desk_screen_led
          - service: script.do_nothing
  id: automation.zl_gr_applies_different_scenes_based_on_scene_selections_state_execution_guest_room
- alias: ZM-GR Sonos Pause Playing After People Left-Guest Room
  trigger:
  - platform: state
    entity_id: input_select.guest_room_occupancy
    to: Outside
    for: 00:00:01
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '55'
    trigger: time_pattern
  action:
  - condition: state
    entity_id: input_select.guest_room_occupancy
    state: Outside
    for: 00:00:01
  - alias: Turn media_player.xiaomi_lx5a_a862_play_control state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
        condition: state
        entity_id:
        - media_player.xiaomi_lx5a_a862_play_control
        state: playing
      then:
        alias: Turn media_player.xiaomi_lx5a_a862_play_control state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          service: media_player.media_play_pause
          entity_id:
          - media_player.xiaomi_lx5a_a862_play_control
  id: automation.zm_gr_sonos_pause_playing_after_people_left_guest_room
- alias: ZLB-GR Wall Switch - Single Press - Toggle Ceiling Light-Guest Room
  trigger:
  - platform: state
    entity_id:
    - sensor.guest_room_wall_button
    - sensor.guest_room_wall_button_2
    to:
    - '1'
    - single
    - single_left
    - single_right
    - single_center
    - button_1_single
    - button_2_single
    - button_3_single
  action:
  - alias: Turn light.guest_room_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - light.guest_room_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn light.guest_room_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_off
          entity_id:
          - light.guest_room_ceiling_light
      else:
        alias: Turn light.guest_room_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_on
          entity_id:
          - light.guest_room_ceiling_light
  id: automation.zlb_gr_wall_switch_single_press_toggle_ceiling_light_guest_room
- alias: ZLB-GR Wall Switch - Double Click - Leave Room and Turn Off Everything-Guest Room
  trigger:
  - platform: state
    entity_id:
    - sensor.guest_room_wall_button
    - sensor.guest_room_wall_button_2
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_gr_lights_off_if_no_person_guest_room
    - automation.zh_gr_heating_schedule_off_if_people_left_the_room_guest_room
  - service: input_select.select_option
    target:
      entity_id: input_select.guest_room_occupancy
    data:
      option: Outside
  id: automation.zlb_gr_wall_switch_double_click_leave_room_and_turn_off_everything_guest_room
- alias: ZOc-GR Occupancy Update-Guest Room
  id: automation.zoc_gr_occupancy_update_guest_room
  trigger:
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 120
  - entity_id: group.guest_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - trigger: homeassistant
    event: start
  - minutes: /3
    seconds: '55'
    trigger: time_pattern
  action:
  - choose:
    - alias: Outside -> Just Entered when motion is on
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Outside
      - condition: state
        entity_id: group.guest_room_motion_group
        state: 'on'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Just Entered
    - alias: Outside -> Outside when motion is not on
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Outside
      - condition: template
        value_template: '{{ not is_state(''group.guest_room_motion_group'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Stayed Inside when motion stays on
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.guest_room_motion_group'', ''on'') and (as_timestamp(now()) - as_timestamp(states[''group.guest_room_motion_group''].last_changed)) >= 150 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Stayed Inside
    - alias: Just Entered -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.guest_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.guest_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Just Entered by default
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Just Entered
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Just Entered
    - alias: Stayed Inside -> In Sleep when sleep time and stayed long enough
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Stayed Inside
      - condition: state
        entity_id: input_boolean.guest_room_sleep_time
        state: 'on'
      - condition: template
        value_template: '{{ is_state(''input_select.guest_room_occupancy'', ''Stayed Inside'') and (as_timestamp(now()) - as_timestamp(states[''input_select.guest_room_occupancy''].last_changed)) > 1800 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: In Sleep
    - alias: Stayed Inside -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Stayed Inside
      - condition: template
        value_template: '{{ is_state(''group.guest_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.guest_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Outside
    - alias: Stayed Inside -> Stayed Inside by default
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: Stayed Inside
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Stayed Inside when sleep time ends
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ not is_state(''input_boolean.guest_room_sleep_time'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ is_state(''group.guest_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.guest_room_motion_group''].last_changed)) > 300 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Outside
    - alias: In Sleep -> In Sleep by default
      conditions:
      - condition: state
        entity_id: input_select.guest_room_occupancy
        state: In Sleep
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: In Sleep
    default:
    - service: script.do_nothing
- alias: ZOc-GR Occupancy Override and sync to Timer-Guest Room
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.guest_room_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.guest_room_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.guest_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_gr_occupancy_update_guest_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_gr_occupancy_update_guest_room
      - service: input_select.select_option
        target:
          entity_id: input_select.guest_room_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.guest_room_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.guest_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_gr_occupancy_update_guest_room state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_gr_occupancy_update_guest_room
  id: automation.zoc_gr_occupancy_override_and_sync_to_timer_guest_room
- alias: ZOc-GR Occupancy Override Sync from Timer-Guest Room
  mode: single
  trigger:
  - platform: state
    entity_id: timer.guest_room_auto_off_suspended_timer
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '34'
    trigger: time_pattern
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.guest_room_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.guest_room_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.guest_room_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.guest_room_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.guest_room_auto_off_suspended
  id: automation.zoc_gr_occupancy_override_sync_from_timer_guest_room
