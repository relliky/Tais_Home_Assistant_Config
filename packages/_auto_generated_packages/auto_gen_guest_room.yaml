- alias: ZLB-GR Single Button Control-Guest Room
  trigger:
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - single
    - '1'
    id: CYCLE_SCENES
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - double
    - '2'
    id: TOGGLE_CURTAINS
  - platform: state
    entity_id: sensor.guest_room_button_1
    to:
    - hold
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id: sensor.guest_room_button_2
    to:
    - hold
    id: TOGGLE_LAMP_1
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - triple
    - '3'
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - quadruple
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - many
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.guest_room_button_1
    - sensor.guest_room_button_2
    to:
    - release
    id: DO_NOTHING
  mode: queued
  action:
    choose:
    - conditions:
      - condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.guest_room_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.guest_room_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.guest_room_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.guest_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.guest_room_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.guest_room_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.guest_room_scene
            scene: All White
    - conditions:
      - condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
      - condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_guest_room state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_guest_room
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_guest_room state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.adaptive_lighting_sleep_mode_guest_room
          else:
            alias: Turn switch.adaptive_lighting_sleep_mode_guest_room state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.adaptive_lighting_sleep_mode_guest_room
    - conditions:
      - condition: trigger
        id: TOGGLE_CURTAINS
      sequence:
      - alias: Turn cover.guest_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id:
            - cover.guest_room_curtain
          - service: cover.toggle
            entity_id:
            - cover.guest_room_curtain
    - conditions:
      - condition: trigger
        id: TOGGLE_CURTAIN_0
      sequence:
      - alias: Turn cover.guest_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: cover.guest_room_curtain
            state: 'on'
            match: any
          then:
            alias: Turn cover.guest_room_curtain state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: cover.guest_room_curtain
          else:
            alias: Turn cover.guest_room_curtain state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: cover.guest_room_curtain
    - conditions:
      - condition: trigger
        id: INCREMENT_CURTAINS
