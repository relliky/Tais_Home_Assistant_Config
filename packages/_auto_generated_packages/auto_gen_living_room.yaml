                  - light.living_room_floor_light_1
                  - light.living_room_floor_light_2
              else:
                alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_off
                  entity_id:
                  - light.living_room_floor_light_1
                  - light.living_room_floor_light_2
            - if:
                condition: state
                entity_id: input_boolean.led_control_dark_living_room
                state: 'on'
              then:
                alias: Turn switch.living_room_floor_light_3 state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id:
                  - switch.living_room_floor_light_3
              else:
                alias: Turn switch.living_room_floor_light_3 state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id:
                  - switch.living_room_floor_light_3
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_dark_living_room
                state: 'on'
              then:
                alias: Turn cover.living_room_curtain_1 state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.living_room_curtain_1
                  - service: cover.open_cover
                    entity_id:
                    - cover.living_room_curtain_1
              else:
                alias: Turn cover.living_room_curtain_1 state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.living_room_curtain_1
                  - service: cover.close_cover
                    entity_id:
                    - cover.living_room_curtain_1
  id: automation.zl_lr_applies_different_scenes_based_on_scene_selections_state_execution_living_room
- alias: ZM-LR Sonos Pause Playing After People Left-Living Room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    to: Outside
    for: 00:00:01
  - minutes: /30
    seconds: '37'
    platform: time_pattern
  action:
  - condition: state
    entity_id: input_select.living_room_occupancy
    state: Outside
    for: 00:00:01
  - alias: Turn media_player.living_room_sonos state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
        condition: state
        entity_id:
        - media_player.living_room_sonos
        state: playing
      then:
        alias: Turn media_player.living_room_sonos state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          service: media_player.media_play_pause
          entity_id:
          - media_player.living_room_sonos
  id: automation.zm_lr_sonos_pause_playing_after_people_left_living_room
- alias: ZLB-LR Wall Switch - Double Press - Leave Room and Turn Off Everything-Living Room
  trigger:
  - platform: state
    entity_id:
    - sensor.living_room_wall_button
    - sensor.living_room_wall_button_2
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_lr_lights_off_if_no_person_living_room
    - automation.zh_lr_heating_schedule_off_if_people_left_the_room_living_room
  - service: input_select.select_option
    target:
      entity_id: input_select.living_room_occupancy
    data:
      option: Outside
  id: automation.zlb_lr_wall_switch_double_press_leave_room_and_turn_off_everything_living_room
- alias: ZOc-LR Occupancy Update-Living Room
  id: automation.zoc_lr_occupancy_update_living_room
  trigger:
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 300
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 120
  - entity_id: group.living_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - minutes: /5
    seconds: '58'
    platform: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.living_room_occupancy
      motion_str: group.living_room_motion_group
      sleep_time: input_boolean.living_room_sleep_time
      turn_to_outside_when_no_motion: 'no'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 120
      sleep_to_outside_timesout: 300
      inside_to_sleep_timeout: 300
- alias: ZTV-LR Reset Picture Mode When Turning on TV-Living Room
  trigger:
  - platform: state
    entity_id:
    - media_player.living_room_tv
    from: 'off'
    to: 'on'
  action:
  - alias: Turn media_player.living_room_tv
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: Set TV brightness when it is on
        condition: state
        entity_id:
        - media_player.living_room_tv
        state: 'on'
      then:
        service: input_select.select_option
        data:
          entity_id:
          - input_select.living_room_tv_picture_mode
          option: Standard
  id: automation.ztv_lr_reset_picture_mode_when_turning_on_tv_living_room
- alias: ZN-LR Notify Zigbee Offline Devices -Living Room
  trigger:
  - platform: state
    entity_id: switch.living_room_wall_switch
    to: unavailable
    for: 00:03:00
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: 'LR 0F gateway zigbee devices are offline. Restarting gateway. Offline device: switch.living_room_wall_switch'
      notify_tai: 'yes'
  - alias: Turn switch.living_room_gateway_power state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_off
      entity_id: switch.living_room_gateway_power
  - delay: 00:00:02
  - alias: Turn switch.living_room_gateway_power state=on
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_on
      entity_id: switch.living_room_gateway_power
  id: automation.zn_lr_notify_zigbee_offline_devices_living_room
- alias: ZN-LR Notify Wifi Offline Devices -Living Room
  trigger:
  - platform: state
    entity_id: light.kitchen_worktop_led
    to: unavailable
    for: 00:03:00
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: 'LR 0F wifi devices are offline. You may want to manual restart 2.4Ghz Wifi. Offline device: light.kitchen_worktop_led'
      notify_tai: 'yes'
  id: automation.zn_lr_notify_wifi_offline_devices_living_room
- alias: ZN-LR Notify Window Left Open When Tai is Leaving Zone-Living Room
  trigger:
  - platform: zone
    entity_id: device_tracker.tais_iphone_13
    zone: zone.home
    event: leave
  condition:
  - condition: state
    entity_id: group.living_room_window_group
    state: 'on'
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: Living Room windows are left open. But you have left home. Is that ok?
      notify_tai: 'yes'
  id: automation.zn_lr_notify_window_left_open_when_tai_is_leaving_zone_living_room
- alias: ZN-LR Notify Window Left Open When Ke is Leaving Zone-Living Room
  trigger:
