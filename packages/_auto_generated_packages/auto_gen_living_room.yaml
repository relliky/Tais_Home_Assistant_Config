      notify_ke: 'yes'
  id: automation.zn_lr_notify_window_left_open_when_ke_is_leaving_zone_living_room
- alias: ZN-LR Notify Window Left Open in Bedtime -Living Room
  trigger:
  - platform: time
    at:
    - '21:00:00'
    - '23:00:00'
    - 00:00:00
    - 01:00:00
    - 02:00:00
    - 03:00:00
  condition:
  - condition: state
    entity_id: group.living_room_window_group
    state: 'on'
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: Living Room windows are left open. But it's almost bedtime time. Is that ok?
      notify_tai: 'yes'
      notify_ke: 'yes'
