              service: light.turn_on
              entity_id:
              - light.master_toilet_ceiling_light
              - light.master_toilet_dressing_room_light
          - alias: Turn switch.master_toilet_floor_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.master_toilet_floor_led
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.master_toilet_scene
        state: Ceiling Light White
      sequence:
        alias: Ceiling Light White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn switch.master_toilet_mirror_led state=off
            if:
            - '{{ 1 == 1 }}'
