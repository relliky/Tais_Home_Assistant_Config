      sequence:
        alias: Lamp LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_toilet_ceiling_light light.master_toilet_dressing_room_light state=off
            if:
            - '{{ 1 == 1 }}'
