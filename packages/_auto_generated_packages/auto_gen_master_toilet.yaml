      sequence:
        alias: Sleep Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.master_toilet_sleep_mode
    - conditions:
      - condition: state
        entity_id: input_select.master_toilet_scene
        state: All Off
      sequence:
        alias: All Off
        if:
        - '{{ 1 == 1 }}'
