adaptive_lighting:
- name: Master Toilet
  lights:
  - light.master_toilet_ceiling_light
  - light.master_toilet_dressing_room_light
  prefer_rgb_color: false
  transition: 45
  initial_transition: 1
  interval: 90
  min_brightness: 50
  max_brightness: 100
  min_color_temp: 2700
  max_color_temp: 4000
  sleep_brightness: 1
  sleep_color_temp: 2200
  min_sunset_time: '17:30'
  take_over_control: true
  autoreset_control_seconds: 86400
  detect_non_ha_changes: false
  only_once: false
  adapt_only_on_bare_turn_on: true
  separate_turn_on_commands: false
  send_split_delay: 500
  adapt_delay: 0.5
  intercept: true
  multi_light_intercept: true
  include_config_in_attributes: false
automation:
- alias: ZH-MT Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-Master Toilet
  triggers:
  - trigger: state
    entity_id: input_boolean.master_toilet_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va4111274240
    attribute: temperature
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va4111274240
    attribute: current_temperature
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '59'
    trigger: time_pattern
  mode: single
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.master_toilet_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.master_toilet'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va4111274240'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float(22) | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va4111274240
    - delay: 00:05:00
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va4111274240
  id: automation.zh_mt_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_master_toilet
