        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - switch.master_toilet_mirror_demister
            state: 'on'
            match: any
          then:
            alias: Turn switch.master_toilet_mirror_demister state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.master_toilet_mirror_demister
          else:
            alias: Turn switch.master_toilet_mirror_demister state=on
            if:
            - '{{ 1 == 1 }}'
