              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_low_light_outdoor_master_toilet
                  state: 'on'
                then:
                  alias: Turn cover.master_toilet_dressing_room_blind state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_on
                    entity_id:
                    - cover.master_toilet_dressing_room_blind
                else:
                  alias: Turn cover.master_toilet_dressing_room_blind state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_off
                    entity_id:
                    - cover.master_toilet_dressing_room_blind
        else:
          alias: If it is sleep mode
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_master_toilet
            state: 'on'
          then:
            alias: curtain states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.curtain_control_sleep_mode_master_toilet
                    state: 'on'
                  then:
                    alias: Turn cover.master_toilet_dressing_room_blind state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: homeassistant.turn_on
                      entity_id:
                      - cover.master_toilet_dressing_room_blind
                  else:
                    alias: Turn cover.master_toilet_dressing_room_blind state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: homeassistant.turn_off
                      entity_id:
                      - cover.master_toilet_dressing_room_blind
          else:
