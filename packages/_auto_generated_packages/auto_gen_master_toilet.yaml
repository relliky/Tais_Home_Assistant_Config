    - condition: numeric_state
      entity_id: sensor.met_office_cambridge_city_airport_temperature_3_hourly
      above: '15'
    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_master_toilet
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_master_toilet
              state: 'on'
            then:
              alias: Turn cover.master_toilet_dressing_room_blind state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                service: homeassistant.turn_on
                entity_id:
                - cover.master_toilet_dressing_room_blind
            else:
              alias: Turn cover.master_toilet_dressing_room_blind state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                service: homeassistant.turn_off
                entity_id:
                - cover.master_toilet_dressing_room_blind
    else:
      alias: If it is moderate light outdoor
      if:
      - condition: template
        value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_moderate_light_outdoor_master_toilet'') | float(0) }}'
      - condition: state
