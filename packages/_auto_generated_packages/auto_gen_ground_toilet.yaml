              else:
                service: script.do_nothing
  id: automation.zl_0t_applies_different_scenes_based_on_scene_selections_state_execution_ground_toilet
- alias: ZLB-0T Wall Switch - Single Press - Toggle Ceiling Light-Ground Toilet
  trigger:
  - platform: state
    entity_id:
    - sensor.ground_toilet_wall_button
    - sensor.ground_toilet_wall_button_2
    to:
    - '1'
    - single
    - single_left
    - single_right
    - single_center
    - button_1_single
    - button_2_single
    - button_3_single
  action:
  - alias: Turn light.ground_toilet_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - light.ground_toilet_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn light.ground_toilet_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_off
          entity_id:
          - light.ground_toilet_ceiling_light
      else:
        alias: Turn light.ground_toilet_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_on
          entity_id:
          - light.ground_toilet_ceiling_light
  id: automation.zlb_0t_wall_switch_single_press_toggle_ceiling_light_ground_toilet
- alias: ZLB-0T Wall Switch - Double Press - Leave Room and Turn Off Everything-Ground Toilet
  trigger:
  - platform: state
    entity_id:
    - sensor.ground_toilet_wall_button
    - sensor.ground_toilet_wall_button_2
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_0t_lights_off_if_no_person_ground_toilet
    - automation.zh_0t_heating_schedule_off_if_people_left_the_room_ground_toilet
  - service: input_select.select_option
    target:
      entity_id: input_select.ground_toilet_occupancy
    data:
      option: Outside
  id: automation.zlb_0t_wall_switch_double_press_leave_room_and_turn_off_everything_ground_toilet
- alias: ZOc-0T Occupancy Update-Ground Toilet
  id: automation.zoc_0t_occupancy_update_ground_toilet
  trigger:
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'on'
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'off'
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - entity_id: group.ground_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '8'
    trigger: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.ground_toilet_occupancy
      motion_str: group.ground_toilet_motion_group
      sleep_time: input_boolean.always_off_constant
      turn_to_outside_when_no_motion: 'yes'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 300
      sleep_to_outside_timesout: 3600
      inside_to_sleep_timeout: 1800
- alias: ZOc-0T Occupancy Override and sync to Timer-Ground Toilet
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.ground_toilet_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.ground_toilet_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.ground_toilet_auto_off_suspended_timer
      - alias: Turn automation.zoc_0t_occupancy_update_ground_toilet state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_0t_occupancy_update_ground_toilet
      - service: input_select.select_option
        target:
          entity_id: input_select.ground_toilet_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.ground_toilet_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.ground_toilet_auto_off_suspended_timer
      - alias: Turn automation.zoc_0t_occupancy_update_ground_toilet state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_0t_occupancy_update_ground_toilet
  id: automation.zoc_0t_occupancy_override_and_sync_to_timer_ground_toilet
- alias: ZOc-0T Occupancy Override Sync from Timer-Ground Toilet
  mode: single
  trigger:
  - platform: state
    entity_id: timer.ground_toilet_auto_off_suspended_timer
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.ground_toilet_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.ground_toilet_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.ground_toilet_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.ground_toilet_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.ground_toilet_auto_off_suspended
  id: automation.zoc_0t_occupancy_override_sync_from_timer_ground_toilet
