  - name: Ground Toilet Unavailable Entities
    state: '{% set added_device_entities =  [''sensor.ground_toilet_temperature_sensor'', ''sensor.ground_toilet_temperature_sensor_battery'', ''binary_sensor.ground_toilet_occupancy_sensor_occupancy'', ''sensor.ground_toilet_occupancy_sensor_battery'', ''binary_sensor.ground_toilet_xiaomi_home_occupancy_sensor_occupancy'', ''sensor.ground_toilet_xiaomi_home_occupancy_sensor_battery'', ''sensor.ground_toilet_entrance_motion_sensor_battery'', ''sensor.ground_toilet_wall_button'', ''sensor.ground_toilet_tado_availiabity'', ''binary_sensor.ground_toilet_heating_required'', ''binary_sensor.ground_toilet_entrance_motion_sensor_motion'', ''switch.ground_toilet_wall_switch_1'', ''switch.ground_toilet_wall_switch_2'', ''light.ground_toilet_ceiling_light''] %}{% set ns = namespace() %}{% set ns.num_unavail_devices = 0 %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}      {% set ns.num_unavail_devices = ns.num_unavail_devices + 1 %}   {% endif %}{% endfor %}{% if ns.num_unavail_devices > 0%}  on  {% else %}  off {% endif %}'
    attributes:
