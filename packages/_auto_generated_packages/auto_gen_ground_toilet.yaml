        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.ceiling_light_control_bright_afternoon_ground_toilet
                state: 'on'
              then:
                alias: Turn light.ground_toilet_ceiling_light state=on
                if:
