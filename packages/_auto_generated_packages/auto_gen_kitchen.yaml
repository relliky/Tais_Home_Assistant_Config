- alias: ZOc-KC Occupancy Update-Kitchen
  id: automation.zoc_kc_occupancy_update_kitchen
  trigger:
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'on'
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'off'
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 600
  - entity_id: group.kitchen_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '31'
    trigger: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.kitchen_occupancy
      motion_str: group.kitchen_motion_group
      sleep_time: input_boolean.always_off_constant
      turn_to_outside_when_no_motion: 'no'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 600
      sleep_to_outside_timesout: 3600
      inside_to_sleep_timeout: 1800
- alias: ZOc-KC Occupancy Override and sync to Timer-Kitchen
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.kitchen_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.kitchen_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.kitchen_auto_off_suspended_timer
      - alias: Turn automation.zoc_kc_occupancy_update_kitchen state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_kc_occupancy_update_kitchen
      - service: input_select.select_option
        target:
          entity_id: input_select.kitchen_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.kitchen_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.kitchen_auto_off_suspended_timer
      - alias: Turn automation.zoc_kc_occupancy_update_kitchen state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_kc_occupancy_update_kitchen
  id: automation.zoc_kc_occupancy_override_and_sync_to_timer_kitchen
- alias: ZOc-KC Occupancy Override Sync from Timer-Kitchen
  mode: single
  trigger:
  - platform: state
    entity_id: timer.kitchen_auto_off_suspended_timer
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.kitchen_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.kitchen_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.kitchen_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_auto_off_suspended
  id: automation.zoc_kc_occupancy_override_sync_from_timer_kitchen
