    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.582d34828f85_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
