- alias: ZM-KC Sonos Pause Playing After People Left-Kitchen
  trigger:
  - platform: state
    entity_id: input_select.kitchen_occupancy
    to: Outside
    for: 00:00:01
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '42'
    trigger: time_pattern
  action:
  - condition: state
    entity_id: input_select.kitchen_occupancy
    state: Outside
    for: 00:00:01
  - alias: Turn media_player.kitchen_sonos state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
        condition: state
        entity_id:
        - media_player.kitchen_sonos
        state: playing
      then:
        alias: Turn media_player.kitchen_sonos state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          service: media_player.media_play_pause
          entity_id:
          - media_player.kitchen_sonos
  id: automation.zm_kc_sonos_pause_playing_after_people_left_kitchen
- alias: ZM-KC Reset Camera Position After People Left-Kitchen
  trigger:
