- alias: ZLB-KC Wall Switch - Single Left Press - Toggle Ceiling Light-Kitchen
  trigger:
  - platform: state
    entity_id:
    - sensor.kitchen_wall_button
    - sensor.kitchen_wall_button_2
    to:
    - single_left
    - button_1_single
  action:
  - alias: Turn light.kitchen_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - light.kitchen_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn light.kitchen_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_off
          entity_id:
          - light.kitchen_ceiling_light
      else:
        alias: Turn light.kitchen_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_on
          entity_id:
          - light.kitchen_ceiling_light
  id: automation.zlb_kc_wall_switch_single_left_press_toggle_ceiling_light_kitchen
