  - name: Front Door Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.e4aaec80bc25_battery'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
