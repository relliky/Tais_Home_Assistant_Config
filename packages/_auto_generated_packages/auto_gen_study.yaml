      notify_tai: 'yes'
  - alias: Turn switch.study_gateway_power_2 state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_off
      entity_id: switch.study_gateway_power_2
  - delay: 00:00:02
  - alias: Turn switch.study_gateway_power_2 state=on
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_on
      entity_id: switch.study_gateway_power_2
