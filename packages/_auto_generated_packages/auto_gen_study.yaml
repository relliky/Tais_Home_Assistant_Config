  id: automation.zoc_st_occupancy_update_study
  trigger:
  - entity_id: group.study_motion_group
    platform: state
    to: 'on'
  - entity_id: group.study_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.study_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.study_motion_group
    platform: state
    to: 'off'
  - entity_id: group.study_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - entity_id: group.study_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - minutes: /5
    seconds: '41'
    platform: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.study_occupancy
      motion_str: group.study_motion_group
