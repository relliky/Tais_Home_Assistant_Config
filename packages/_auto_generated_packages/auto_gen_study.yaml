- alias: ZH-ST Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-Study
  triggers:
  - trigger: state
    entity_id: input_boolean.study_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va4136768512
    attribute: temperature
  - minutes: /30
    seconds: '8'
    platform: time_pattern
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.study_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.study'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va4136768512'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va4136768512
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va4136768512
