- alias: ZLB-ET Wall Switch - Single Press - Toggle Ceiling Light-En-suite Toilet
  trigger:
  - platform: state
    entity_id:
    - sensor.en_suite_toilet_wall_button
    - sensor.en_suite_toilet_wall_button_2
    to:
    - '1'
    - single
    - single_left
    - single_right
    - single_center
    - button_1_single
    - button_2_single
    - button_3_single
  action:
  - alias: Turn light.en_suite_toilet_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - light.en_suite_toilet_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn light.en_suite_toilet_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_off
          entity_id:
          - light.en_suite_toilet_ceiling_light
      else:
        alias: Turn light.en_suite_toilet_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_on
          entity_id:
          - light.en_suite_toilet_ceiling_light
  id: automation.zlb_et_wall_switch_single_press_toggle_ceiling_light_en_suite_toilet
- alias: ZLB-ET Wall Switch - Double Press - Leave Room and Turn Off Everything-En-suite Toilet
  trigger:
  - platform: state
    entity_id:
    - sensor.en_suite_toilet_wall_button
    - sensor.en_suite_toilet_wall_button_2
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_et_lights_off_if_no_person_en_suite_toilet
    - automation.zh_et_heating_schedule_off_if_people_left_the_room_en_suite_toilet
  - service: input_select.select_option
    target:
      entity_id: input_select.en_suite_toilet_occupancy
    data:
      option: Outside
  id: automation.zlb_et_wall_switch_double_press_leave_room_and_turn_off_everything_en_suite_toilet
- alias: ZLM-ET Mirror Sensor On Turns On Ceiling Light With Cool Temperature-En-suite Toilet
  trigger:
  - platform: state
    entity_id:
    - switch.en_suite_toilet_mirror_led
    from: 'off'
    to: 'on'
  action:
  - condition: state
    entity_id:
    - switch.en_suite_toilet_mirror_led
    state: 'on'
  - service: light.turn_on
    target:
      entity_id:
      - light.en_suite_toilet_ceiling_light
    data:
      brightness_pct: 100
      kelvin: 6500
  id: automation.zlm_et_mirror_sensor_on_turns_on_ceiling_light_with_cool_temperature_en_suite_toilet
- alias: ZLM-ET Mirror Sensor Off Turns Ceiling Light With Adaptive Lighting Unless it's off-En-suite Toilet
  trigger:
  - platform: state
    entity_id:
    - switch.en_suite_toilet_mirror_led
    from: 'on'
    to: 'off'
  action:
  - condition: state
    entity_id:
    - switch.en_suite_toilet_mirror_led
    state: 'off'
  - service: adaptive_lighting.apply
    data:
      entity_id: switch.adaptive_lighting_adapt_brightness_en_suite_toilet
  id: automation.zlm_et_mirror_sensor_off_turns_ceiling_light_with_adaptive_lighting_unless_it_s_off_en_suite_toilet
- alias: ZOc-ET Occupancy Update-En-suite Toilet
  id: automation.zoc_et_occupancy_update_en_suite_toilet
  trigger:
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'on'
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'off'
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - entity_id: group.en_suite_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '45'
    trigger: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.en_suite_toilet_occupancy
      motion_str: group.en_suite_toilet_motion_group
      sleep_time: input_boolean.always_off_constant
      turn_to_outside_when_no_motion: 'yes'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 300
      sleep_to_outside_timesout: 3600
      inside_to_sleep_timeout: 1800
- alias: ZOc-ET Occupancy Override and sync to Timer-En-suite Toilet
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.en_suite_toilet_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.en_suite_toilet_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.en_suite_toilet_auto_off_suspended_timer
      - alias: Turn automation.zoc_et_occupancy_update_en_suite_toilet state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_et_occupancy_update_en_suite_toilet
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_toilet_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.en_suite_toilet_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.en_suite_toilet_auto_off_suspended_timer
      - alias: Turn automation.zoc_et_occupancy_update_en_suite_toilet state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_et_occupancy_update_en_suite_toilet
  id: automation.zoc_et_occupancy_override_and_sync_to_timer_en_suite_toilet
- alias: ZOc-ET Occupancy Override Sync from Timer-En-suite Toilet
  mode: single
  trigger:
  - platform: state
    entity_id: timer.en_suite_toilet_auto_off_suspended_timer
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.en_suite_toilet_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.en_suite_toilet_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.en_suite_toilet_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.en_suite_toilet_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.en_suite_toilet_auto_off_suspended
  id: automation.zoc_et_occupancy_override_sync_from_timer_en_suite_toilet
