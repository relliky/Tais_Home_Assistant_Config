- binary_sensor:
  - name: En Suite Toilet Low Battery
    state: '{% set state = states("sensor.en_suite_toilet_min_battery") %} {% if state == "unavailable" or state == "unknown" or int(state) > 20 %} off {% else%} on {% endif %}'
binary_sensor:
- platform: group
  name: En-suite Toilet Motion Sensor Motion
  device_class: motion
  entities: binary_sensor.0x00158d000572839f_motion
event: []
lock: []
light:
- platform: group
  name: En-suite Toilet Ceiling Light
  entities: light.en_suite_toilet_light_hue
group:
  en_suite_toilet_occupancy_group:
    name: En Suite Toilet Occupancy Group
    entities:
    - input_select.en_suite_toilet_occupancy
    - group.en_suite_toilet_motion_group
    - binary_sensor.en_suite_toilet_motion_sensor_motion
    - binary_sensor.en_suite_toilet_xiaomi_home_occupancy_sensor_occupancy
    - automation.zoc_et_occupancy_update_en_suite_toilet
  en_suite_toilet_motion_group:
    name: En Suite Toilet Motion Group
    entities:
    - binary_sensor.en_suite_toilet_motion_sensor_motion
    - binary_sensor.en_suite_toilet_xiaomi_home_occupancy_sensor_occupancy
  en_suite_toilet_light_group:
    name: En Suite Toilet Light Group
    entities:
    - switch.en_suite_toilet_mirror_led
    - light.en_suite_toilet_ceiling_light
  en_suite_toilet_timeout_window_group:
    name: En Suite Toilet Timeout Window Group
    entities: []
  en_suite_toilet_curtain_group:
    name: En Suite Toilet Curtain Group
    entities: []
  en_suite_toilet_battery:
    name: En Suite Toilet Battery
    entities:
    - sensor.en_suite_toilet_motion_sensor_battery
    - sensor.en_suite_toilet_xiaomi_home_occupancy_sensor_battery
    - sensor.en_suite_toilet_temperature_sensor_battery
    - sensor.en_suite_toilet_mirror_robot_battery
  en_suite_toilet_auto_gen_automations:
    name: En Suite Toilet Auto Gen Automations
    entities:
    - climate.tado_smart_radiator_thermostat_va0429069312
    - input_boolean.ceiling_light_control_bright_morning_en_suite_toilet
    - input_boolean.led_control_bright_morning_en_suite_toilet
    - input_boolean.ceiling_light_control_bright_afternoon_en_suite_toilet
    - input_boolean.led_control_bright_afternoon_en_suite_toilet
    - input_boolean.ceiling_light_control_dark_en_suite_toilet
    - input_boolean.led_control_dark_en_suite_toilet
    - automation.zh_et_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_en_suite_toilet
    - automation.zl_et_lights_and_curtain_on_if_entering_to_room_en_suite_toilet
    - automation.zl_et_lights_off_if_no_person_en_suite_toilet
    - automation.zl_et_disable_entering_lights_on_automation_if_any_people_are_in_the_room_en_suite_toilet
    - automation.zh_et_heating_schedule_on_if_staying_in_the_room_en_suite_toilet
    - automation.zh_et_heating_schedule_off_if_people_left_the_room_en_suite_toilet
    - automation.zh_et_heating_manual_override_en_suite_toilet
    - automation.zl_et_applies_different_scenes_based_on_scene_selections_state_execution_en_suite_toilet
    - automation.zlb_et_wall_switch_single_press_toggle_ceiling_light_en_suite_toilet
    - automation.zlb_et_wall_switch_double_press_leave_room_and_turn_off_everything_en_suite_toilet
    - automation.zlm_et_mirror_sensor_on_turns_on_ceiling_light_with_cool_temperature_en_suite_toilet
