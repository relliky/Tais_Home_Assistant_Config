template:
- sensor:
  - name: En-suite Toilet Motion Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.0x00158d000572839f_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- binary_sensor:
  - name: En-suite Toilet Xiaomi Home Occupancy Sensor Occupancy
    state: '{% if states.sensor["linp_cn_blt_3_1onif11i44g00_es5b_no_one_duration_p_2_1082"].state == ''unavailable'' or states.sensor["linp_cn_blt_3_1onif11i44g00_es5b_no_one_duration_p_2_1082"].state  == ''unknown''%}

      {{states.binary_sensor["linp_cn_blt_3_1onif11i44g00_es5b_occupancy_status_p_2_1078"].state}}

      {% elif states.sensor["linp_cn_blt_3_1onif11i44g00_es5b_no_one_duration_p_2_1082"].state == ''0'' %}

      {{states.binary_sensor["linp_cn_blt_3_1onif11i44g00_es5b_occupancy_status_p_2_1078"].state}}

      {# else is equivilence to elif states.sensor["linp_cn_blt_3_1onif11i44g00_es5b_no_one_duration_p_2_1082"].state > "0" #}

      {% else %}

      off

      {% endif %}

      '
    device_class: occupancy
- sensor:
  - name: En-suite Toilet Xiaomi Home Occupancy Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.linp_cn_blt_3_1onif11i44g00_es5b_battery_level_p_7_1003_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: En-suite Toilet Wall Button
    state: '{{states.sensor["0x00158d000522d90c_action"].state}}'
- sensor:
  - name: En-suite Toilet Temperature Sensor
    unit_of_measurement: "\xB0C"
    state: '{{states.sensor["xiaomi_cn_blt_3_1nt5fj3n0c800_mini_temperature_p_2_1001"].state | float(22) | round(1)}}'
- sensor:
  - name: En-suite Toilet Humidity Sensor
    unit_of_measurement: '%'
    state: '{{states.sensor["xiaomi_cn_blt_3_1nt5fj3n0c800_mini_relative_humidity_p_2_1002"].state | float(40) | round(1)}}'
- sensor:
  - name: En-suite Toilet Temperature Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.xiaomi_cn_blt_3_1nt5fj3n0c800_mini_battery_level_p_3_1003_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: En-suite Toilet Tado Availiabity
    unit_of_measurement: "\xB0C"
    state: '{{states("sensor.tado_smart_radiator_thermostat_va0429069312_current_temperature") | float(22) | round(1)}}'
- binary_sensor:
  - name: En-suite Toilet Heating Required
    state: '{% set climate = "climate.tado_smart_radiator_thermostat_va0429069312" %}{% if states(climate) == "unavailable" or states(climate) == "off" or (state_attr(climate, "temperature") <= state_attr(climate, "current_temperature"))  %}off{% else %} on{% endif %}'
- sensor:
  - name: En-suite Toilet Mirror Robot Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.adp_cn_1206094287_adfbt6_battery_percentage_p_3_15'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
