automation:
- alias: ZH-GT Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-Guest Toilet
  triggers:
  - trigger: state
    entity_id: input_boolean.guest_toilet_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va2241008640
    attribute: temperature
  - minutes: /30
    seconds: '56'
    platform: time_pattern
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.guest_toilet_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.guest_toilet'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va2241008640'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va2241008640
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va2241008640
  id: automation.zh_gt_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_guest_toilet
- alias: ZL-GT Lights and Curtain On If Entering to Room-Guest Toilet
  id: automation.zl_gt_lights_and_curtain_on_if_entering_to_room_guest_toilet
  trigger:
    entity_id:
    - group.guest_toilet_motion_group
    platform: state
    to: 'on'
  action:
  - service: automation.turn_off
    entity_id: automation.zl_gt_lights_and_curtain_on_if_entering_to_room_guest_toilet
    data:
      stop_actions: false
  - service: script.call_room_scene
    data:
      room_scene_select: input_select.guest_toilet_scene
      scene: Idle
  - alias: If it is bright morning
    if:
    - alias: Bright morning
      condition: and
      conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.living_room_east_side_light_sensor
          above: input_number.guest_toilet_min_value_as_bright
        - condition: state
          entity_id: sensor.living_room_east_side_light_sensor
          state:
          - unavailable
          - unknown
      - condition: or
        conditions:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        - condition: state
          entity_id: sun.sun
          state:
          - unavailable
          - unknown
      - condition: time
        after: input_datetime.morning_start_time_guest_toilet
        before: input_datetime.morning_end_time_guest_toilet
    then:
      alias: States when bright morning
      if:
      - '{{ 1 == 1 }}'
