      entity_id: switch.adaptive_lighting_adapt_brightness_guest_toilet
  id: automation.zlm_gt_mirror_sensor_off_turns_ceiling_light_with_adaptive_lighting_unless_it_s_off_guest_toilet
- alias: ZOc-GT Occupancy Update-Guest Toilet
  id: automation.zoc_gt_occupancy_update_guest_toilet
  trigger:
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'on'
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'off'
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - entity_id: group.guest_toilet_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 3600
  - minutes: /5
    seconds: '32'
    platform: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.guest_toilet_occupancy
      motion_str: group.guest_toilet_motion_group
      sleep_time: input_boolean.always_off_constant
      turn_to_outside_when_no_motion: 'no'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 300
      sleep_to_outside_timesout: 3600
      inside_to_sleep_timeout: 1800
group:
  guest_toilet_occupancy_group:
    name: Guest Toilet Occupancy Group
    entities:
    - input_select.guest_toilet_occupancy
    - group.guest_toilet_motion_group
    - binary_sensor.guest_toilet_motion_sensor_motion
    - binary_sensor.guest_toilet_shower_motion_sensor_motion
    - automation.zoc_gt_occupancy_update_guest_toilet
  guest_toilet_motion_group:
    name: Guest Toilet Motion Group
    entities:
    - binary_sensor.guest_toilet_motion_sensor_motion
    - binary_sensor.guest_toilet_shower_motion_sensor_motion
  guest_toilet_light_group:
    name: Guest Toilet Light Group
    entities:
    - switch.guest_toilet_floor_led
    - light.guest_toilet_ceiling_light
  guest_toilet_window_group:
    name: Guest Toilet Window Group
    entities: []
  guest_toilet_timeout_window_group:
    name: Guest Toilet Timeout Window Group
    entities: []
  guest_toilet_curtain_group:
    name: Guest Toilet Curtain Group
    entities: []
  guest_toilet_battery:
    name: Guest Toilet Battery
    entities:
    - sensor.guest_toilet_temperature_sensor_battery
    - sensor.guest_toilet_shower_motion_sensor_battery
    - sensor.guest_toilet_motion_sensor_battery
    - sensor.guest_toilet_mirror_sensor_light_sensor_battery
  guest_toilet_auto_gen_automations:
    name: Guest Toilet Auto Gen Automations
    entities:
    - climate.tado_smart_radiator_thermostat_va2241008640
    - input_boolean.ceiling_light_control_bright_morning_guest_toilet
    - input_boolean.led_control_bright_morning_guest_toilet
    - input_boolean.ceiling_light_control_bright_afternoon_guest_toilet
    - input_boolean.led_control_bright_afternoon_guest_toilet
    - input_boolean.ceiling_light_control_dark_guest_toilet
    - input_boolean.led_control_dark_guest_toilet
    - automation.zh_gt_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_guest_toilet
    - automation.zl_gt_lights_and_curtain_on_if_entering_to_room_guest_toilet
    - automation.zl_gt_lights_off_if_no_person_guest_toilet
    - automation.zl_gt_disable_entering_lights_on_automation_if_any_people_are_in_the_room_guest_toilet
    - automation.zh_gt_heating_schedule_on_if_staying_in_the_room_guest_toilet
