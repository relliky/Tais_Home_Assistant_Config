      sequence:
        alias: States when bright afternoon
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.ceiling_light_control_bright_afternoon_guest_toilet
                state: 'on'
              then:
                alias: Turn light.guest_toilet_ceiling_light state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_on
                  entity_id:
                  - light.guest_toilet_ceiling_light
              else:
                alias: Turn light.guest_toilet_ceiling_light state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_off
                  entity_id:
                  - light.guest_toilet_ceiling_light
            - if:
                condition: state
                entity_id: input_boolean.lamp_control_bright_afternoon_guest_toilet
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
            - if:
                condition: state
                entity_id: input_boolean.led_control_bright_afternoon_guest_toilet
                state: 'on'
              then:
                alias: Turn switch.guest_toilet_floor_led state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id:
                  - switch.guest_toilet_floor_led
              else:
                alias: Turn switch.guest_toilet_floor_led state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id:
                  - switch.guest_toilet_floor_led
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_bright_afternoon_guest_toilet
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.guest_toilet_scene
        state: States when dark
      sequence:
        alias: States when dark
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.ceiling_light_control_dark_guest_toilet
                state: 'on'
              then:
                alias: Turn light.guest_toilet_ceiling_light state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_on
                  entity_id:
                  - light.guest_toilet_ceiling_light
              else:
                alias: Turn light.guest_toilet_ceiling_light state=off
