  trigger:
  - platform: state
    entity_id:
    - binary_sensor.guest_toilet_mirror_sensor
    from: 'on'
    to: 'off'
  action:
  - condition: state
    entity_id:
    - binary_sensor.guest_toilet_mirror_sensor
    state: 'off'
