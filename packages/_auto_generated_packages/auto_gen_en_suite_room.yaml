automation:
- alias: ZH-ER Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-En-suite Room
  triggers:
  - trigger: state
    entity_id: input_boolean.en_suite_room_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va1167266816
    attribute: temperature
  - minutes: /30
    seconds: '59'
    platform: time_pattern
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.en_suite_room_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.en_suite_room'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va1167266816'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va1167266816
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va1167266816
  id: automation.zh_er_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_en_suite_room
- alias: ZL-ER Lights and Curtain On If Entering to Room-En-suite Room
  id: automation.zl_er_lights_and_curtain_on_if_entering_to_room_en_suite_room
  trigger:
    entity_id:
    - binary_sensor.en_suite_room_entrance_motion_sensor_motion
    platform: state
    to: 'on'
  action:
  - service: automation.turn_off
    entity_id: automation.zl_er_lights_and_curtain_on_if_entering_to_room_en_suite_room
    data:
      stop_actions: false
  - service: script.call_room_scene
    data:
      room_scene_select: input_select.en_suite_room_scene
      scene: Idle
  - alias: If it is bright morning
    if:
    - alias: Bright morning
      condition: and
      conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.master_room_west_side_light_sensor
          above: input_number.en_suite_room_min_value_as_bright
        - condition: state
          entity_id: sensor.master_room_west_side_light_sensor
          state:
          - unavailable
          - unknown
      - condition: or
        conditions:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        - condition: state
          entity_id: sun.sun
          state:
          - unavailable
          - unknown
      - condition: time
        after: input_datetime.morning_start_time_en_suite_room
        before: input_datetime.morning_end_time_en_suite_room
    then:
      alias: States when bright morning
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.ceiling_light_control_bright_morning_en_suite_room
              state: 'on'
            then:
              alias: Turn light.en_suite_room_ceiling_light state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_on
                entity_id:
                - light.en_suite_room_ceiling_light
            else:
              alias: Turn light.en_suite_room_ceiling_light state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_off
                entity_id:
                - light.en_suite_room_ceiling_light
          - if:
              condition: state
              entity_id: input_boolean.lamp_control_bright_morning_en_suite_room
              state: 'on'
            then:
              alias: Turn light.en_suite_room_lamp_1 light.en_suite_room_lamp_2 state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_on
                entity_id:
                - light.en_suite_room_lamp_1
                - light.en_suite_room_lamp_2
            else:
              alias: Turn light.en_suite_room_lamp_1 light.en_suite_room_lamp_2 state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_off
                entity_id:
                - light.en_suite_room_lamp_1
                - light.en_suite_room_lamp_2
          - if:
              condition: state
              entity_id: input_boolean.led_control_bright_morning_en_suite_room
              state: 'on'
            then:
              alias: Turn light.en_suite_room_bed_led state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_on
                entity_id:
                - light.en_suite_room_bed_led
            else:
              alias: Turn light.en_suite_room_bed_led state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                service: light.turn_off
                entity_id:
                - light.en_suite_room_bed_led
          - if:
