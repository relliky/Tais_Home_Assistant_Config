                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.en_suite_room_curtain
                - service: cover.open_cover
                  entity_id:
                  - cover.en_suite_room_curtain
            else:
              alias: Turn cover.en_suite_room_curtain state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.en_suite_room_curtain
                - service: cover.close_cover
                  entity_id:
                  - cover.en_suite_room_curtain
    else:
      alias: If it is dark
