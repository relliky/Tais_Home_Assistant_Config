- alias: ZL-ER Lights Off If No Person-En-suite Room
  id: automation.zl_er_lights_off_if_no_person_en_suite_room
  trigger:
  - platform: state
    entity_id: input_select.en_suite_room_occupancy
    to: Outside
  - minutes: /30
    seconds: '52'
    platform: time_pattern
  condition:
  - condition: state
    entity_id: input_select.en_suite_room_occupancy
    state: Outside
  - condition: state
    entity_id: group.en_suite_room_motion_group
    state: 'off'
    for: 00:01:00
  action:
    parallel:
    - alias: Turn automation.zl_er_lights_and_curtain_on_if_entering_to_room_en_suite_room state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        service: homeassistant.turn_on
        entity_id: automation.zl_er_lights_and_curtain_on_if_entering_to_room_en_suite_room
    - service: script.call_room_scene
      data:
        room_scene_select: input_select.en_suite_room_scene
        scene: Idle
    - alias: If it is bright morning
      if:
      - alias: Bright morning
        condition: and
        conditions:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.master_room_west_side_light_sensor
            above: input_number.en_suite_room_min_value_as_bright
          - condition: state
            entity_id: sensor.master_room_west_side_light_sensor
            state:
            - unavailable
            - unknown
        - condition: or
          conditions:
          - condition: state
            entity_id: sun.sun
            state: above_horizon
          - condition: state
            entity_id: sun.sun
            state:
            - unavailable
            - unknown
        - condition: time
          after: input_datetime.morning_start_time_en_suite_room
          before: input_datetime.morning_end_time_en_suite_room
      then:
        alias: States when left in bright morning
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_bright_morning_when_left_en_suite_room
                state: 'on'
              then:
                alias: Turn cover.en_suite_room_curtain state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.en_suite_room_curtain
                  - service: cover.open_cover
                    entity_id:
                    - cover.en_suite_room_curtain
              else:
                alias: Turn cover.en_suite_room_curtain state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.en_suite_room_curtain
                  - service: cover.close_cover
                    entity_id:
                    - cover.en_suite_room_curtain
      else:
        alias: If it is dark
        if:
        - alias: Bright afternoon
          condition: and
          conditions:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.master_room_west_side_light_sensor
              above: input_number.en_suite_room_min_value_as_bright
            - condition: state
              entity_id: sensor.master_room_west_side_light_sensor
              state:
              - unavailable
              - unknown
          - condition: or
            conditions:
            - condition: state
              entity_id: sun.sun
              state: above_horizon
            - condition: state
              entity_id: sun.sun
              state:
              - unavailable
              - unknown
          - condition: time
            after: input_datetime.afternoon_start_time_en_suite_room
            before: input_datetime.afternoon_end_time_en_suite_room
        then:
          alias: States when left in bright afternoon
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_bright_afternoon_when_left_en_suite_room
                  state: 'on'
                then:
                  alias: Turn cover.en_suite_room_curtain state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                    - service: cover.open_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                else:
                  alias: Turn cover.en_suite_room_curtain state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                    - service: cover.close_cover
                      entity_id:
                      - cover.en_suite_room_curtain
        else:
          alias: States when left in dark
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_dark_when_left_en_suite_room
                  state: 'on'
                then:
                  alias: Turn cover.en_suite_room_curtain state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                    - service: cover.open_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                else:
                  alias: Turn cover.en_suite_room_curtain state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.en_suite_room_curtain
                    - service: cover.close_cover
                      entity_id:
                      - cover.en_suite_room_curtain
    - service: script.do_nothing
    - alias: All Off
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - alias: Turn light.en_suite_room_ceiling_light state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: light.turn_off
            entity_id:
            - light.en_suite_room_ceiling_light
        - alias: Turn light.en_suite_room_lamp_1 light.en_suite_room_lamp_2 state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: light.turn_off
            entity_id:
            - light.en_suite_room_lamp_1
            - light.en_suite_room_lamp_2
        - alias: Turn light.en_suite_room_bed_led state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: light.turn_off
            entity_id:
            - light.en_suite_room_bed_led
        - service: script.do_nothing
    - service: script.do_nothing
- alias: ZL-ER Disable Entering Lights-on Automation If any People are in the Room-En-suite Room
  trigger:
  - platform: state
    entity_id: input_select.en_suite_room_occupancy
    to:
    - Just Entered
    - In Sleep
    - Stayed Inside
  action:
  - delay: 00:00:10
  - service: automation.turn_off
    entity_id: automation.zl_er_lights_and_curtain_on_if_entering_to_room_en_suite_room
    data:
      stop_actions: 'false'
  id: automation.zl_er_disable_entering_lights_on_automation_if_any_people_are_in_the_room_en_suite_room
- alias: ZL-ER Turn on LED if Walking In the Dark-En-suite Room
  mode: single
  trigger:
  - entity_id:
    - binary_sensor.en_suite_room_entrance_motion_sensor_motion
    - binary_sensor.en_suite_room_floor_1_motion_sensor_motion
    - binary_sensor.en_suite_room_floor_2_motion_sensor_motion
    platform: state
    to: 'on'
  condition:
  - condition: state
    entity_id: input_select.indoor_brightness
    state: dark
  action:
  - condition: not
    conditions:
    - condition: state
      entity_id:
      - light.en_suite_room_bed_led
      - light.en_suite_room_ceiling_light
      - light.en_suite_room_lamp_1
      - light.en_suite_room_lamp_2
      state: 'on'
      match: any
  - alias: Turn light.en_suite_room_bed_led state=on light_brightness=40
    if:
    - '{{ 1 == 1 }}'
    then:
      service: light.turn_on
      entity_id:
      - light.en_suite_room_bed_led
      data:
        brightness_pct: 40
  - alias: Wait for floor sensors to go off for 1 min to turn off LED. Stop waiting if it has wait for 1 hour.
    wait_for_trigger:
      platform: state
      entity_id:
      - binary_sensor.en_suite_room_entrance_motion_sensor_motion
      - binary_sensor.en_suite_room_floor_1_motion_sensor_motion
      - binary_sensor.en_suite_room_floor_2_motion_sensor_motion
      to: 'off'
      for: 00:01:00
    timeout: 01:00:00
  - alias: ' Testing if other lights are manually turned on after the LED was on'
    condition: not
    conditions:
    - condition: state
      entity_id:
      - light.en_suite_room_ceiling_light
      - light.en_suite_room_lamp_1
      - light.en_suite_room_lamp_2
      state: 'on'
      match: any
  - alias: Turn light.en_suite_room_bed_led state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      service: light.turn_off
      entity_id:
      - light.en_suite_room_bed_led
  id: automation.zl_er_turn_on_led_if_walking_in_the_dark_en_suite_room
- alias: ZH-ER Heating Schedule On If Staying In the Room-En-suite Room
  id: automation.zh_er_heating_schedule_on_if_staying_in_the_room_en_suite_room
  trigger:
  - platform: state
    entity_id: input_select.en_suite_room_occupancy
    from:
    - Just Entered
    - Outside
    to:
    - Stayed Inside
    - In Sleep
  action:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.en_suite_room
        state: heat
    then:
      alias: Turn heating state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        alias: ''
        if:
        - '{{ 1 == 1 }}'
        then:
        - alias: Turn climate.en_suite_room state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: climate.set_hvac_mode
            data:
              hvac_mode: heat
            entity_id: climate.en_suite_room
        - alias: Turn switch.schedule_en_suite_room_temperature state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: homeassistant.turn_on
            entity_id: switch.schedule_en_suite_room_temperature
- alias: ZH-ER Heating Schedule Off If People Left the Room-En-suite Room
  id: automation.zh_er_heating_schedule_off_if_people_left_the_room_en_suite_room
  trigger:
  - platform: state
    entity_id: input_select.en_suite_room_occupancy
    to: Outside
  - minutes: /30
    seconds: '41'
