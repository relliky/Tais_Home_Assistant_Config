            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Hue
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Hue
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Sleep Mode
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Sleep Mode
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Dark Night Mode
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Dark Night Mode
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.master_room_scene
            scene: All White
    - conditions:
      - condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
