- alias: ZOc-MR Occupancy Update-Master Room
  id: automation.zoc_mr_occupancy_update_master_room
  trigger:
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 300
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 120
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - trigger: homeassistant
    event: start
  - minutes: /3
    seconds: '14'
    trigger: time_pattern
  action:
  - choose:
    - alias: Outside -> Just Entered when motion is on
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Outside
      - condition: state
        entity_id: group.master_room_motion_group
        state: 'on'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Just Entered
    - alias: Outside -> Outside when motion is not on
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Outside
      - condition: template
        value_template: '{{ not is_state(''group.master_room_motion_group'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Stayed Inside when motion stays on
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.master_room_motion_group'', ''on'') and (as_timestamp(now()) - as_timestamp(states[''group.master_room_motion_group''].last_changed)) >= 150 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Stayed Inside
    - alias: Just Entered -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.master_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.master_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Just Entered by default
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Just Entered
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Just Entered
    - alias: Stayed Inside -> In Sleep when sleep time and stayed long enough
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Stayed Inside
      - condition: state
        entity_id: input_boolean.master_room_sleep_time
        state: 'on'
      - condition: template
        value_template: '{{ is_state(''input_select.master_room_occupancy'', ''Stayed Inside'') and (as_timestamp(now()) - as_timestamp(states[''input_select.master_room_occupancy''].last_changed)) > 300 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: In Sleep
    - alias: Stayed Inside -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Stayed Inside
      - condition: template
        value_template: '{{ is_state(''group.master_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.master_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Outside
    - alias: Stayed Inside -> Stayed Inside by default
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: Stayed Inside
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Stayed Inside when sleep time ends
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ not is_state(''input_boolean.master_room_sleep_time'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ is_state(''group.master_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.master_room_motion_group''].last_changed)) > 300 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Outside
    - alias: In Sleep -> In Sleep by default
      conditions:
      - condition: state
        entity_id: input_select.master_room_occupancy
        state: In Sleep
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: In Sleep
    default:
    - service: script.do_nothing
- alias: ZOc-MR Occupancy Override and sync to Timer-Master Room
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.master_room_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.master_room_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.master_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_mr_occupancy_update_master_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_mr_occupancy_update_master_room
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.master_room_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.master_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_mr_occupancy_update_master_room state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_mr_occupancy_update_master_room
  id: automation.zoc_mr_occupancy_override_and_sync_to_timer_master_room
- alias: ZOc-MR Occupancy Override Sync from Timer-Master Room
  mode: single
  trigger:
  - platform: state
    entity_id: timer.master_room_auto_off_suspended_timer
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '38'
    trigger: time_pattern
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.master_room_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.master_room_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.master_room_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.master_room_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.master_room_auto_off_suspended
  id: automation.zoc_mr_occupancy_override_sync_from_timer_master_room
