- alias: ZL-MR Curtain States When No Person Present-Master Room
  id: automation.zl_mr_curtain_states_when_no_person_present_master_room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    to: Outside
    for: 00:03:00
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '31'
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.master_room_occupancy
    state: Outside
    for: 00:03:00
  action:
  - alias: If it is intense light summer
    if:
    - condition: template
      value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_intense_light_summer_master_room'') | float(0) }}'
    - condition: numeric_state
      entity_id: sensor.met_office_cambridge_city_airport_temperature_3_hourly
      above: '12'
    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_master_room
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_master_room
              state: 'on'
            then:
              alias: Turn cover.master_room_curtain state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                service: homeassistant.turn_on
                entity_id:
                - cover.master_room_curtain
            else:
              alias: Turn cover.master_room_curtain state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                service: homeassistant.turn_off
                entity_id:
                - cover.master_room_curtain
    else:
      alias: If it is moderate light outdoor
      if:
      - condition: template
        value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_moderate_light_outdoor_master_room'') | float(0) }}'
      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_master_room
        state: 'off'
      then:
        alias: curtain states when moderate light outdoor
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_moderate_light_outdoor_master_room
                state: 'on'
              then:
                alias: Turn cover.master_room_curtain state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id:
                  - cover.master_room_curtain
              else:
                alias: Turn cover.master_room_curtain state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id:
                  - cover.master_room_curtain
      else:
        alias: If it is low light outdoor
        if:
        - condition: template
          value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) <= states(''input_number.intensity_threshold_moderate_light_outdoor_master_room'') | float(0) }}'
        - condition: state
          entity_id: switch.adaptive_lighting_sleep_mode_master_room
          state: 'off'
        then:
          alias: curtain states when low light outdoor
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_low_light_outdoor_master_room
                  state: 'on'
                then:
                  alias: Turn cover.master_room_curtain state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_on
                    entity_id:
                    - cover.master_room_curtain
                else:
                  alias: Turn cover.master_room_curtain state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_off
                    entity_id:
                    - cover.master_room_curtain
        else:
          alias: If it is sleep mode
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_master_room
            state: 'on'
          then:
            alias: curtain states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.curtain_control_sleep_mode_master_room
                    state: 'on'
                  then:
                    alias: Turn cover.master_room_curtain state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: homeassistant.turn_on
                      entity_id:
                      - cover.master_room_curtain
                  else:
                    alias: Turn cover.master_room_curtain state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: homeassistant.turn_off
                      entity_id:
                      - cover.master_room_curtain
          else:
            alias: Default
            service: script.do_nothing
