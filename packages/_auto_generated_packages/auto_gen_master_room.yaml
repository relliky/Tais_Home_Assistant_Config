- alias: ZOc-MR Occupancy Update-Master Room
  id: automation.zoc_mr_occupancy_update_master_room
  trigger:
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 300
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 120
  - entity_id: group.master_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 300
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '16'
    trigger: time_pattern
  action:
    service: pyscript.room_occupancy_state_machine
    data:
      occupancy_entity_str: input_select.master_room_occupancy
      motion_str: group.master_room_motion_group
      sleep_time: input_boolean.master_room_sleep_time
      turn_to_outside_when_no_motion: 'no'
      entered_to_inside_timeout: 150
      inside_to_outside_timeout: 120
      sleep_to_outside_timesout: 300
      inside_to_sleep_timeout: 300
- alias: ZOc-MR Occupancy Override and sync to Timer-Master Room
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.master_room_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.master_room_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.master_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_mr_occupancy_update_master_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_mr_occupancy_update_master_room
      - service: input_select.select_option
        target:
          entity_id: input_select.master_room_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.master_room_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.master_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_mr_occupancy_update_master_room state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_mr_occupancy_update_master_room
  id: automation.zoc_mr_occupancy_override_and_sync_to_timer_master_room
- alias: ZOc-MR Occupancy Override Sync from Timer-Master Room
  mode: single
  trigger:
  - platform: state
    entity_id: timer.master_room_auto_off_suspended_timer
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.master_room_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.master_room_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.master_room_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.master_room_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.master_room_auto_off_suspended
  id: automation.zoc_mr_occupancy_override_sync_from_timer_master_room
