    - media_player.master_room_tv
    from: 'off'
    to: 'on'
  action:
  - alias: Turn media_player.master_room_tv
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: Set TV brightness when it is on
        condition: state
        entity_id:
        - media_player.master_room_tv
        state: 'on'
      then:
        service: input_select.select_option
        data:
          entity_id:
          - input_select.master_room_tv_picture_mode
          option: Standard
  id: automation.ztv_mr_reset_picture_mode_when_turning_on_tv_master_room
- alias: ZN-MR Notify Zigbee Offline Devices -Master Room
  trigger:
  - platform: state
    entity_id: switch.master_toilet_wall_switch
    to: unavailable
    for: 00:03:00
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: 'MR 2F gateway zigbee devices are offline - Restarting gateway - Offline device: switch.master_toilet_wall_switch'
      notify_tai: 'yes'
  - alias: Turn switch.master_room_gateway_power state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_off
      entity_id: switch.master_room_gateway_power
  - delay: 00:00:02
  - alias: Turn switch.master_room_gateway_power state=on
    if:
    - '{{ 1 == 1 }}'
    then:
      service: homeassistant.turn_on
      entity_id: switch.master_room_gateway_power
  id: automation.zn_mr_notify_zigbee_offline_devices_master_room
- alias: ZN-MR Notify Wifi Offline Devices -Master Room
  trigger:
  - platform: state
    entity_id: cover.master_room_blind_1
    to: unavailable
    for: 00:03:00
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: 'MR 2F wifi devices are offline. You may want to manual restart 2.4Ghz Wifi. Offline device: cover.master_room_blind_1'
      notify_tai: 'yes'
  id: automation.zn_mr_notify_wifi_offline_devices_master_room
- alias: ZN-MR Notify Window Left Open When Tai is Leaving Zone-Master Room
  trigger:
  - platform: zone
    entity_id: device_tracker.tais_iphone_13
    zone: zone.home
    event: leave
  condition:
  - condition: state
    entity_id: group.master_room_window_group
    state: 'on'
  action:
  - service: script.notify_alexa_speakers_and_phones
    data:
      tts_message: Master Room windows or locks are left open. But you have left home. Is that ok?
      notify_tai: 'yes'
  id: automation.zn_mr_notify_window_left_open_when_tai_is_leaving_zone_master_room
- alias: ZN-MR Notify Window Left Open When Ke is Leaving Zone-Master Room
  trigger:
  - platform: zone
