                    - light.master_room_tv_led
                else:
                  alias: Turn light.master_room_tv_led state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: light.turn_off
                    entity_id:
                    - light.master_room_tv_led
        else:
          alias: If it is bright afternoon
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_master_room
            state: 'on'
          then:
            alias: light states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.ceiling_light_control_sleep_mode_master_room
                    state: 'on'
                  then:
                    alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_on
                      entity_id:
                      - light.master_room_bed_ceiling_light
                      - light.master_room_drawer_ceiling_light
                  else:
                    alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_off
                      entity_id:
                      - light.master_room_bed_ceiling_light
                      - light.master_room_drawer_ceiling_light
                - if:
                    condition: state
                    entity_id: input_boolean.lamp_control_sleep_mode_master_room
                    state: 'on'
                  then:
                    alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_on
                      entity_id:
                      - light.master_room_lamp_1
                      - light.master_room_lamp_2
                  else:
                    alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_off
                      entity_id:
                      - light.master_room_lamp_1
                      - light.master_room_lamp_2
                - if:
                    condition: state
                    entity_id: input_boolean.led_control_sleep_mode_master_room
                    state: 'on'
                  then:
                    alias: Turn light.master_room_tv_led state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_on
                      entity_id:
                      - light.master_room_tv_led
                  else:
                    alias: Turn light.master_room_tv_led state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_off
                      entity_id:
                      - light.master_room_tv_led
          else:
            alias: Default
            service: script.do_nothing
  - service: automation.trigger
    entity_id: automation.zl_mr_curtain_states_when_no_person_present_master_room
- alias: ZL-MR Lights Off If No Person-Master Room
  id: automation.zl_mr_lights_off_if_no_person_master_room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    to: Outside
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '24'
    trigger: time_pattern
  condition:
  - condition: state
    entity_id: input_select.master_room_occupancy
    state: Outside
  - condition: state
    entity_id: group.master_room_motion_group
    state: 'off'
    for: 00:01:00
  action:
    parallel:
    - alias: Turn automation.zl_mr_lights_on_if_entering_to_room_master_room state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        service: homeassistant.turn_on
        entity_id: automation.zl_mr_lights_on_if_entering_to_room_master_room
    - alias: Turn media_player.master_room_tv state=off
      if:
      - '{{ 1 == 1 }}'
      then:
        service: homeassistant.turn_off
        entity_id:
        - media_player.master_room_tv
    - service: script.call_room_scene
      data:
        room_scene_select: input_select.master_room_scene
        scene: Idle
    - alias: All Off
      if:
      - '{{ 1 == 1 }}'
      then:
      - alias: All Off
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
          - alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_lamp_1
              - light.master_room_lamp_2
          - alias: Turn light.master_room_tv_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_tv_led
          - alias: Turn media_player.master_room_tv
            if:
            - '{{ 1 == 1 }}'
            then:
              if:
              - alias: Set TV brightness when it is on
                condition: state
                entity_id:
                - media_player.master_room_tv
                state: 'on'
              then:
                service: input_select.select_option
                data:
                  entity_id:
                  - input_select.master_room_tv_picture_mode
                  option: Standard
      - alias: Turn cover.master_room_blind state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: cover.master_room_blind
    - service: script.do_nothing
- alias: ZL-MR Disable Entering Lights-on Automation If any People are in the Room-Master Room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    to:
    - Just Entered
    - In Sleep
    - Stayed Inside
  action:
  - delay: 00:00:10
  - service: automation.turn_off
    entity_id: automation.zl_mr_lights_on_if_entering_to_room_master_room
    data:
      stop_actions: 'false'
  id: automation.zl_mr_disable_entering_lights_on_automation_if_any_people_are_in_the_room_master_room
- alias: ZL-MR Turn on LED if Walking In the Dark-Master Room
  mode: single
  trigger:
  - entity_id:
    - binary_sensor.master_room_entrance_motion_sensor_motion
    - binary_sensor.master_room_stair_motion_sensor_motion
    - binary_sensor.master_room_dressing_table_motion_sensor_motion
    - binary_sensor.master_room_tv_motion_sensor_motion
    - binary_sensor.master_room_drawer_motion_sensor_motion
    - binary_sensor.master_toilet_dressing_room_motion_sensor_motion
    platform: state
    to: 'on'
  condition:
  - condition: state
    entity_id: input_select.indoor_brightness
    state: dark
  action:
  - condition: not
    conditions:
    - condition: state
      entity_id:
      - light.master_room_tv_led
      - light.master_room_bed_ceiling_light
      - light.master_room_drawer_ceiling_light
      - light.master_room_lamp_1
      - light.master_room_lamp_2
      state: 'on'
      match: any
  - alias: Dark Night Mode
    if:
    - '{{ 1 == 1 }}'
    then:
    - parallel:
      - service: homeassistant.turn_on
        entity_id: scene.master_room_dark_night_mode
      - alias: Turn media_player.master_room_tv
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: Set TV brightness when it is on
            condition: state
            entity_id:
            - media_player.master_room_tv
            state: 'on'
          then:
            service: input_select.select_option
            data:
              entity_id:
              - input_select.master_room_tv_picture_mode
              option: Movie
  - alias: Wait for floor sensors to go off for 1 min to turn off LED. Stop waiting if it has wait for 1 hour.
    wait_for_trigger:
      platform: state
      entity_id:
      - binary_sensor.master_room_entrance_motion_sensor_motion
      - binary_sensor.master_room_stair_motion_sensor_motion
      - binary_sensor.master_room_dressing_table_motion_sensor_motion
      - binary_sensor.master_room_tv_motion_sensor_motion
      - binary_sensor.master_room_drawer_motion_sensor_motion
      - binary_sensor.master_toilet_dressing_room_motion_sensor_motion
      to: 'off'
      for: 00:01:00
    timeout: 01:00:00
  - alias: ' Testing if other lights are manually turned on after the LED was on'
    condition: not
    conditions:
    - condition: state
      entity_id:
      - light.master_room_bed_ceiling_light
      - light.master_room_drawer_ceiling_light
      - light.master_room_lamp_1
      - light.master_room_lamp_2
      state: 'on'
      match: any
  - alias: Turn light.master_room_tv_led state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      service: light.turn_off
      entity_id:
      - light.master_room_tv_led
  id: automation.zl_mr_turn_on_led_if_walking_in_the_dark_master_room
- alias: ZH-MR Heating Schedule On If Staying In the Room-Master Room
  id: automation.zh_mr_heating_schedule_on_if_staying_in_the_room_master_room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    from:
    - Just Entered
    - Outside
    to:
    - Stayed Inside
    - In Sleep
  action:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.master_room
        state: heat
    then:
      alias: Turn heating state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        alias: ''
        if:
        - '{{ 1 == 1 }}'
        then:
        - alias: Turn climate.master_room state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: climate.set_hvac_mode
            data:
              hvac_mode: heat
            entity_id: climate.master_room
        - alias: Turn switch.schedule_master_room_temperature state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: homeassistant.turn_on
            entity_id: switch.schedule_master_room_temperature
- alias: ZH-MR Heating Schedule Off If People Left the Room-Master Room
  id: automation.zh_mr_heating_schedule_off_if_people_left_the_room_master_room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    to: Outside
  - trigger: homeassistant
