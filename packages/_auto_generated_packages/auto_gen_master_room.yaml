    - single
    - '1'
    id: CYCLE_SCENES
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - double
    - '2'
    id: TOGGLE_CURTAINS
  - platform: state
    entity_id: sensor.master_room_button_1
    to:
    - hold
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id: sensor.master_room_button_2
    to:
    - hold
    id: TOGGLE_LAMP_1
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - triple
    - '3'
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - quadruple
    id: DO_NOTHING
  - platform: state
