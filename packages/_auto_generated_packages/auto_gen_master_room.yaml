          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_master_room
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_master_room state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.adaptive_lighting_sleep_mode_master_room
          else:
            alias: Turn switch.adaptive_lighting_sleep_mode_master_room state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.adaptive_lighting_sleep_mode_master_room
