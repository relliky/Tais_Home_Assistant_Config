  id: automation.zlb_mr_eight_key_knob_control_master_room
- alias: ZL-MR Applies Different Scenes Based on Scene Selections (State Execution)-Master Room
  trigger:
  - platform: state
    entity_id: input_select.master_room_scene
  mode: restart
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.master_room_scene
        state: All White
      sequence:
        alias: All White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_lamp_1
              - light.master_room_lamp_2
          - alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
          - alias: Turn light.master_room_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_tv_led
          - alias: Turn media_player.master_room_tv
            if:
            - '{{ 1 == 1 }}'
            then:
              if:
              - alias: Set TV brightness when it is on
                condition: state
                entity_id:
                - media_player.master_room_tv
                state: 'on'
              then:
                service: input_select.select_option
                data:
                  entity_id:
                  - input_select.master_room_tv_picture_mode
                  option: Standard
    - conditions:
      - condition: state
        entity_id: input_select.master_room_scene
        state: Ceiling Light White
      sequence:
        alias: Ceiling Light White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_lamp_1
              - light.master_room_lamp_2
          - alias: Turn light.master_room_tv_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_tv_led
          - alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
          - alias: Turn media_player.master_room_tv
            if:
            - '{{ 1 == 1 }}'
            then:
              if:
              - alias: Set TV brightness when it is on
                condition: state
                entity_id:
                - media_player.master_room_tv
                state: 'on'
              then:
                service: input_select.select_option
                data:
                  entity_id:
                  - input_select.master_room_tv_picture_mode
                  option: Standard
    - conditions:
      - condition: state
        entity_id: input_select.master_room_scene
        state: Lamp LED White
      sequence:
        alias: Lamp LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
          - alias: Turn light.master_room_lamp_1 light.master_room_lamp_2 state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_lamp_1
              - light.master_room_lamp_2
          - alias: Turn light.master_room_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_tv_led
    - conditions:
      - condition: state
        entity_id: input_select.master_room_scene
        state: LED White
      sequence:
        alias: LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.master_room_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.master_room_tv_led
    - conditions:
      - condition: state
        entity_id: input_select.master_room_scene
        state: Hue
      sequence:
        alias: Hue
        if:
        - '{{ 1 == 1 }}'
