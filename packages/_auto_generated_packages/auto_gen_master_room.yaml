- alias: ZM-MR Sonos Pause Playing After People Left-Master Room
  trigger:
  - platform: state
    entity_id: input_select.master_room_occupancy
    to: Outside
    for: 00:00:01
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '22'
    trigger: time_pattern
  action:
  - condition: state
    entity_id: input_select.master_room_occupancy
    state: Outside
    for: 00:00:01
  - alias: Turn media_player.master_room_sonos state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
        condition: state
        entity_id:
        - media_player.master_room_sonos
        state: playing
      then:
        alias: Turn media_player.master_room_sonos state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          service: media_player.media_play_pause
          entity_id:
          - media_player.master_room_sonos
  id: automation.zm_mr_sonos_pause_playing_after_people_left_master_room
- alias: ZLB-MR Wall Switch - Double Press - Leave Room and Turn Off Everything-Master Room
  trigger:
  - platform: state
    entity_id:
    - sensor.master_room_entrance_wall_button
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_mr_lights_off_if_no_person_master_room
    - automation.zh_mr_heating_schedule_off_if_people_left_the_room_master_room
  - service: input_select.select_option
    target:
      entity_id: input_select.master_room_occupancy
    data:
      option: Outside
