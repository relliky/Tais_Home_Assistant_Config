        id: TOGGLE_CURTAINS
      sequence:
      - alias: Turn cover.master_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id:
            - cover.master_room_curtain
          - service: cover.toggle
            entity_id:
            - cover.master_room_curtain
    - conditions:
      - condition: trigger
        id: TOGGLE_CURTAIN_0
