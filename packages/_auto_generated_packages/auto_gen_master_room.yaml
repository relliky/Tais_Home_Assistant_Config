    state: Outside
  - service: script.do_nothing
  - condition: state
    entity_id: input_boolean.master_room_heating_override
    state: 'off'
  - alias: Turn heating state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      alias: ''
      if:
      - '{{ 1 == 1 }}'
      then:
      - alias: Turn climate.master_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_hvac_mode
          data:
            hvac_mode: 'off'
          entity_id: climate.master_room
      - alias: Turn switch.schedule_master_room_temperature state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: switch.schedule_master_room_temperature
- alias: ZH-MR Heating Manual Override-Master Room
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.master_room_heating_override
  action:
  - if:
    - condition: state
      entity_id: input_boolean.master_room_heating_override
      state: 'off'
    then:
    - service: automation.trigger
      entity_id:
      - automation.zh_mr_heating_schedule_off_if_people_left_the_room_master_room
    else:
    - service: automation.trigger
      entity_id:
      - automation.zh_mr_heating_schedule_on_if_staying_in_the_room_master_room
    - delay:
        hours: 4
    - service: homeassistant.turn_off
      entity_id: input_boolean.master_room_heating_override
    - service: automation.trigger
      entity_id:
      - automation.zh_mr_heating_schedule_on_if_staying_in_the_room_master_room
  id: automation.zh_mr_heating_manual_override_master_room
- alias: ZLB-MR Single Button Control-Master Room
  trigger:
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - single
    - '1'
    id: CYCLE_SCENES
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - double
    - '2'
    id: TOGGLE_CURTAINS
  - platform: state
    entity_id: sensor.master_room_button_1
    to:
    - hold
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id: sensor.master_room_button_2
    to:
    - hold
    id: TOGGLE_LAMP_1
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - triple
    - '3'
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - quadruple
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - many
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - release
    id: DO_NOTHING
  mode: queued
  action:
    choose:
    - conditions:
        condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Hue
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Hue
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Sleep Mode
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Sleep Mode
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Dark Night Mode
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Dark Night Mode
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.master_room_scene
            scene: All White
    - conditions:
        condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_master_room state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_master_room
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_master_room state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.adaptive_lighting_sleep_mode_master_room
          else:
            alias: Turn switch.adaptive_lighting_sleep_mode_master_room state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.adaptive_lighting_sleep_mode_master_room
    - conditions:
        condition: trigger
        id: TOGGLE_CURTAINS
      sequence:
      - alias: Turn cover.master_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - cover.master_room_curtain
            state: 'on'
            match: any
          then:
            alias: Turn cover.master_room_curtain state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - cover.master_room_curtain
          else:
            alias: Turn cover.master_room_curtain state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - cover.master_room_curtain
    - conditions:
        condition: trigger
        id: TOGGLE_CURTAIN_0
      sequence:
      - alias: Turn cover.master_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id: cover.master_room_curtain
          - if:
            - alias: 'toggle all curtains together: if any of curtains is on, turn off all curtains, otherwise turn on all curtains'
              condition: state
              entity_id: cover.master_room_curtain
              state:
              - open
              - opening
              match: any
            then:
              service: cover.close_cover
              entity_id: cover.master_room_curtain
            else:
              service: cover.open_cover
              entity_id: cover.master_room_curtain
    - conditions:
        condition: trigger
        id: INCREMENT_CURTAINS
      sequence:
      - alias: Turn cover.master_room_curtain state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: script.do_nothing
    - conditions:
        condition: trigger
        id: DECREMENT_CURTAINS
      sequence:
      - alias: Turn cover.master_room_curtain state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          service: script.do_nothing
    - conditions:
        condition: trigger
        id: INCREMENT_CURTAIN_0
      sequence:
      - alias: Turn cover.master_room_curtain state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id: cover.master_room_curtain
          - service: cover.set_cover_position
            target:
              entity_id:
              - cover.master_room_curtain
            data:
              position: '{{ [[ (state_attr(''cover.master_room_curtain'', ''current_position'')) + 51 ,0]|max,100]|min}}'
    - conditions:
        condition: trigger
        id: DECREMENT_CURTAIN_0
      sequence:
      - alias: Turn cover.master_room_curtain state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id: cover.master_room_curtain
          - service: cover.set_cover_position
            target:
              entity_id:
              - cover.master_room_curtain
            data:
              position: '{{ [[ (state_attr(''cover.master_room_curtain'', ''current_position'')) + -51 ,0]|max,100]|min}}'
    - conditions:
        condition: trigger
        id: TOGGLE_ALL_LIGHTS
      sequence:
      - alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light light.master_room_lamp_1 light.master_room_lamp_2 light.master_room_tv_led light.master_room_entrance_light switch.master_room_balcony_wall_light state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - light.master_room_bed_ceiling_light
            - light.master_room_drawer_ceiling_light
            - light.master_room_lamp_1
            - light.master_room_lamp_2
            - light.master_room_tv_led
            - light.master_room_entrance_light
            - switch.master_room_balcony_wall_light
            state: 'on'
            match: any
          then:
            alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light light.master_room_lamp_1 light.master_room_lamp_2 light.master_room_tv_led light.master_room_entrance_light switch.master_room_balcony_wall_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
              - light.master_room_lamp_1
              - light.master_room_lamp_2
              - light.master_room_tv_led
              - light.master_room_entrance_light
              - switch.master_room_balcony_wall_light
          else:
            alias: Turn light.master_room_bed_ceiling_light light.master_room_drawer_ceiling_light light.master_room_lamp_1 light.master_room_lamp_2 light.master_room_tv_led light.master_room_entrance_light switch.master_room_balcony_wall_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - light.master_room_bed_ceiling_light
              - light.master_room_drawer_ceiling_light
              - light.master_room_lamp_1
              - light.master_room_lamp_2
              - light.master_room_tv_led
              - light.master_room_entrance_light
              - switch.master_room_balcony_wall_light
    - conditions:
        condition: trigger
        id: TOGGLE_LAMP_0
      sequence:
      - alias: Turn light.master_room_lamp_1 state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: light.master_room_lamp_1
            state: 'on'
            match: any
          then:
            alias: Turn light.master_room_lamp_1 state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id: light.master_room_lamp_1
          else:
            alias: Turn light.master_room_lamp_1 state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id: light.master_room_lamp_1
    - conditions:
        condition: trigger
        id: INCREMENT_LAMP_0
      sequence:
      - alias: Turn light.master_room_lamp_1 state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: increment brightness unless it is off, set the brightness to 1 percent
            condition: state
            entity_id: light.master_room_lamp_1
            state: 'off'
          then:
          - alias: Turn light.master_room_lamp_1 state=on light_brightness=1
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id: light.master_room_lamp_1
              data:
                brightness_pct: 1
          else:
            service: light.turn_on
            target:
              entity_id: light.master_room_lamp_1
            data:
              brightness_step_pct: 34
