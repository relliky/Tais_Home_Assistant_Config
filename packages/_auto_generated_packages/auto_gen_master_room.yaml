    - sensor.master_room_button_1
    - sensor.master_room_button_2
    - sensor.master_room_button_3
    to:
    - release
    id: DO_NOTHING
  mode: queued
  action:
    choose:
    - conditions:
      - condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.master_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.master_room_scene
            state: Lamp LED White
