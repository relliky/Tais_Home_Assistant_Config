- alias: ZH-MR Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-Master Room
  triggers:
  - trigger: state
    entity_id: input_boolean.master_room_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va0932385792
    attribute: temperature
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va0932385792
    attribute: current_temperature
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '46'
    trigger: time_pattern
  mode: single
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.master_room_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.master_room'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va0932385792'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float(22) | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va0932385792
    - delay: 00:05:00
    else:
    - action: climate.turn_off
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va0932385792
  id: automation.zh_mr_set_radiator_valve_target_temperature_based_on_external_sensor_temperature_difference_master_room
