    entity_id: timer.garden_auto_off_suspended_timer
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.garden_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.garden_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.garden_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.garden_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.garden_auto_off_suspended
  id: automation.zoc_gd_occupancy_override_sync_from_timer_garden
