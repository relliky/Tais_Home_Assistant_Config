                then:
                  service: homeassistant.turn_on
                  entity_id:
                  - switch.garden_ceiling_light
              else:
                alias: Turn switch.garden_ceiling_light state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id:
                  - switch.garden_ceiling_light
            - if:
                condition: state
                entity_id: input_boolean.lamp_control_moderate_light_outdoor_garden
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
            - if:
                condition: state
                entity_id: input_boolean.led_control_moderate_light_outdoor_garden
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
      else:
        alias: If it is bright afternoon
        if:
