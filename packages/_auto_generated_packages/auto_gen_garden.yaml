- alias: ZLB-GD Wall Switch - Single Press - Toggle Ceiling Light-Garden
  trigger:
  - platform: state
    entity_id:
    - sensor.garden_wall_button
    - sensor.garden_wall_button_2
    to:
    - '1'
    - single
    - single_left
    - single_right
    - single_center
    - button_1_single
    - button_2_single
    - button_3_single
  action:
  - alias: Turn switch.garden_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - switch.garden_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn switch.garden_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id:
          - switch.garden_ceiling_light
      else:
        alias: Turn switch.garden_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id:
          - switch.garden_ceiling_light
  id: automation.zlb_gd_wall_switch_single_press_toggle_ceiling_light_garden
- alias: ZLB-GD Wall Switch - Double Click - Leave Room and Turn Off Everything-Garden
  trigger:
