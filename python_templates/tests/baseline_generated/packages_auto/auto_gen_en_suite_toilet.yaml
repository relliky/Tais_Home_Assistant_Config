            entity_id: scene.en_suite_toilet_dark_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.en_suite_toilet_scene
        state: Sleep Mode
      sequence:
        alias: Sleep Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.en_suite_toilet_sleep_mode
    - conditions:
      - condition: state
        entity_id: input_select.en_suite_toilet_scene
        state: All Off
      sequence:
        alias: All Off
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.en_suite_toilet_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.en_suite_toilet_ceiling_light
          - alias: Turn switch.en_suite_toilet_mirror_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.en_suite_toilet_mirror_led
          - service: script.do_nothing
          - service: script.do_nothing
  id: automation.zl_et_applies_different_scenes_based_on_scene_selections_state_execution_en_suite_toilet
- alias: ZLB-ET Mirror Button Control-En-suite Toilet
  trigger:
  - platform: state
    entity_id: binary_sensor.en_suite_toilet_mirror_button_single_click
    to: 'on'
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id: binary_sensor.en_suite_toilet_mirror_button_long_press
    to: 'on'
    id: TOGGLE_DEMISTER
  mode: queued
  action:
    choose:
    - conditions:
        condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.en_suite_toilet_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_toilet_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_toilet_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_toilet_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_toilet_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_toilet_scene
              scene: LED White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_toilet_scene
            state: LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_toilet_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.en_suite_toilet_scene
            scene: All White
    - conditions:
        condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_toilet state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_toilet state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
          else:
            alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_toilet state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
    - conditions:
        condition: trigger
        id: TOGGLE_ALL_LIGHTS
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_led light.en_suite_toilet_ceiling_light state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - switch.en_suite_toilet_mirror_led
            - light.en_suite_toilet_ceiling_light
            state: 'on'
            match: any
          then:
            alias: Turn switch.en_suite_toilet_mirror_led light.en_suite_toilet_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.en_suite_toilet_mirror_led
              - light.en_suite_toilet_ceiling_light
          else:
            alias: Turn switch.en_suite_toilet_mirror_led light.en_suite_toilet_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.en_suite_toilet_mirror_led
              - light.en_suite_toilet_ceiling_light
    - conditions:
        condition: trigger
        id: TOGGLE_LAMP_0
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_led state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.en_suite_toilet_mirror_led
            state: 'on'
            match: any
          then:
            alias: Turn switch.en_suite_toilet_mirror_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.en_suite_toilet_mirror_led
          else:
            alias: Turn switch.en_suite_toilet_mirror_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.en_suite_toilet_mirror_led
    - conditions:
        condition: trigger
        id: INCREMENT_LAMP_0
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_led state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: script.do_nothing
    - conditions:
        condition: trigger
        id: DECREMENT_LAMP_0
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_led state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          service: script.do_nothing
    - conditions:
        condition: trigger
        id: CYCLE_LAMP_0
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_led state=cycle
        if:
        - '{{ 1 == 1 }}'
        then:
          service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_CEILING_LIGHTS
      sequence:
      - alias: Turn light.en_suite_toilet_ceiling_light state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - light.en_suite_toilet_ceiling_light
            state: 'on'
            match: any
          then:
            alias: Turn light.en_suite_toilet_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.en_suite_toilet_ceiling_light
          else:
            alias: Turn light.en_suite_toilet_ceiling_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_toilet_ceiling_light
    - conditions:
        condition: trigger
        id: INCREMENT_CEILING_LIGHTS
      sequence:
      - alias: Turn light.en_suite_toilet_ceiling_light state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: increment brightness unless it is off, set the brightness to 1 percent
            condition: state
            entity_id:
            - light.en_suite_toilet_ceiling_light
            state: 'off'
          then:
          - alias: Turn light.en_suite_toilet_ceiling_light state=on light_brightness=1
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_toilet_ceiling_light
              data:
                brightness_pct: 1
          else:
            service: light.turn_on
            target:
              entity_id:
              - light.en_suite_toilet_ceiling_light
            data:
              brightness_step_pct: 34
    - conditions:
        condition: trigger
        id: DECREMENT_CEILING_LIGHTS
      sequence:
      - alias: Turn light.en_suite_toilet_ceiling_light state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: increment brightness unless it is off, set the brightness to 1 percent
            condition: state
            entity_id:
            - light.en_suite_toilet_ceiling_light
            state: 'off'
          then:
          - alias: Turn light.en_suite_toilet_ceiling_light state=on light_brightness=1
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_toilet_ceiling_light
              data:
                brightness_pct: 1
          else:
            service: light.turn_on
            target:
              entity_id:
              - light.en_suite_toilet_ceiling_light
            data:
              brightness_step_pct: -34
    - conditions:
        condition: trigger
        id: CYCLE_CEILING_LIGHTS
      sequence:
      - alias: Turn light.en_suite_toilet_ceiling_light state=cycle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id:
            - light.en_suite_toilet_ceiling_light
            state: 'off'
          then:
          - service: light.turn_on
            entity_id:
            - light.en_suite_toilet_ceiling_light
            data:
              brightness: 3
          else:
            service: light.turn_on
            entity_id:
            - light.en_suite_toilet_ceiling_light
            data_template:
              brightness: '{% set brightness = state_attr(''light.en_suite_toilet_ceiling_light'', ''brightness'') | int(0) %}{% if brightness == 0 or is_state(''light.en_suite_toilet_ceiling_light'', ''off'') %}3{% elif brightness <= 83 %}84{% elif brightness <= 167 %}168{% elif brightness <= 254 %}255{% else %}0{% endif %}'
    - conditions:
        condition: trigger
        id: TOGGLE_HEATING
      sequence:
      - alias: Turn heating state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id: climate.en_suite_toilet
            state: 'off'
          then:
            alias: Turn heating state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.en_suite_toilet state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: heat
                  entity_id: climate.en_suite_toilet
              - alias: Turn switch.schedule_en_suite_toilet_temperature state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id: switch.schedule_en_suite_toilet_temperature
          else:
            alias: Turn heating state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.en_suite_toilet state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: 'off'
                  entity_id: climate.en_suite_toilet
              - alias: Turn switch.schedule_en_suite_toilet_temperature state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id: switch.schedule_en_suite_toilet_temperature
    - conditions:
        condition: trigger
        id: INCREMENT_HEATING
      sequence:
      - alias: Turn heating state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.en_suite_toilet
          data:
            temperature: '{{ (state_attr(''climate.en_suite_toilet'', ''temperature'')) + 1}}'
    - conditions:
        condition: trigger
        id: DECREMENT_HEATING
      sequence:
      - alias: Turn heating state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.en_suite_toilet
          data:
            temperature: '{{ (state_attr(''climate.en_suite_toilet'', ''temperature'')) + -1}}'
    - conditions:
        condition: trigger
        id: TOGGLE_DEMISTER
      sequence:
      - alias: Turn switch.en_suite_toilet_mirror_demister state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - switch.en_suite_toilet_mirror_demister
            state: 'on'
            match: any
          then:
            alias: Turn switch.en_suite_toilet_mirror_demister state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.en_suite_toilet_mirror_demister
          else:
            alias: Turn switch.en_suite_toilet_mirror_demister state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.en_suite_toilet_mirror_demister
