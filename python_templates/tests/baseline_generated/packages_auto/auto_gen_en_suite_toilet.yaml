        entity_id: input_select.en_suite_toilet_scene
        state: Hue
      sequence:
        alias: Hue
        if:
        - '{{ 1 == 1 }}'
        then:
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - switch.en_suite_toilet_mirror_led
            - light.en_suite_toilet_ceiling_light
            state: 'off'
            rgb: non_rgb_only
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - switch.en_suite_toilet_mirror_led
            - light.en_suite_toilet_ceiling_light
        - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.en_suite_toilet_scene
        state: Night Mode
      sequence:
        alias: Night Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.en_suite_toilet_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.en_suite_toilet_scene
