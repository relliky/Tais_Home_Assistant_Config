              - switch.en_suite_toilet_mirror_led
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.en_suite_toilet_scene
        state: LED White
      sequence:
        alias: LED White
        if:
        - '{{ 1 == 1 }}'
