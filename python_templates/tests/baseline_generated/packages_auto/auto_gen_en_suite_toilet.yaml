    to: 'on'
  - trigger: state
    entity_id: input_boolean.en_suite_toilet_mirror_demister
    from: 'on'
    to: 'off'
  actions:
  - delay:
      milliseconds: 500
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_boolean.en_suite_toilet_mirror_demister'') != states(''input_boolean.en_suite_toilet_mirror_demister_assumed_state'') }}'
      sequence:
      - service: switch.toggle
        target:
          entity_id: switch.adp_cn_1206094287_adfbt6_switch_b_p_3_2
      - service: input_boolean.toggle
        target:
          entity_id: input_boolean.en_suite_toilet_mirror_demister_assumed_state
  mode: queued
  id: automation.zg_et_toggle_en_suite_toilet_mirror_demister_en_suite_toilet
- alias: ZL-ET Curtain States When No Person Present-En-suite Toilet
  id: automation.zl_et_curtain_states_when_no_person_present_en_suite_toilet
  trigger:
  - platform: state
    entity_id: input_select.en_suite_toilet_occupancy
    to: Outside
    for: 00:03:00
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '16'
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.en_suite_toilet_occupancy
    state: Outside
    for: 00:03:00
  action:
  - alias: If it is intense light summer
    if:
    - condition: template
      value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_intense_light_summer_en_suite_toilet'') | float(0) }}'
    - condition: numeric_state
      entity_id: sensor.met_office_cambridge_city_airport_temperature_3_hourly
      above: '12'
    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_en_suite_toilet
              state: 'on'
            then:
              service: script.do_nothing
            else:
              service: script.do_nothing
    else:
      alias: If it is moderate light outdoor
      if:
      - condition: template
        value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_moderate_light_outdoor_en_suite_toilet'') | float(0) }}'
      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
        state: 'off'
      then:
        alias: curtain states when moderate light outdoor
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_moderate_light_outdoor_en_suite_toilet
                state: 'on'
              then:
                service: script.do_nothing
              else:
                service: script.do_nothing
      else:
        alias: If it is low light outdoor
        if:
        - condition: template
          value_template: '{{ states(''sensor.master_room_light_intensity'') | float(0) <= states(''input_number.intensity_threshold_moderate_light_outdoor_en_suite_toilet'') | float(0) }}'
        - condition: state
          entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
          state: 'off'
        then:
          alias: curtain states when low light outdoor
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_low_light_outdoor_en_suite_toilet
                  state: 'on'
                then:
                  service: script.do_nothing
                else:
                  service: script.do_nothing
        else:
          alias: If it is sleep mode
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_en_suite_toilet
            state: 'on'
          then:
            alias: curtain states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.curtain_control_sleep_mode_en_suite_toilet
                    state: 'on'
                  then:
                    service: script.do_nothing
                  else:
                    service: script.do_nothing
          else:
            alias: Default
            service: script.do_nothing
