                  - cover.en_suite_room_curtain
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.en_suite_room_curtain
                    attribute: current_position
                    above: 95
                  then:
                    service: cover.close_cover
                    entity_id:
