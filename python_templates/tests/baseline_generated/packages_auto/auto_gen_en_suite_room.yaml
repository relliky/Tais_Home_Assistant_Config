- alias: ZH-ER Set Radiator Valve Target Temperature Based on External Sensor Temperature Difference-En-suite Room
  triggers:
  - trigger: state
    entity_id: input_boolean.en_suite_room_tado_heater
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va1167266816
    attribute: temperature
  - trigger: state
    entity_id: climate.tado_smart_radiator_thermostat_va1167266816
    attribute: current_temperature
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '42'
    trigger: time_pattern
  mode: single
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.en_suite_room_tado_heater
      state: 'on'
    then:
    - action: climate.set_temperature
      data:
        hvac_mode: heat
        temperature: '{%set room_helper_entity = ''climate.en_suite_room'' %}{%set tado_valve_entity  = ''climate.tado_smart_radiator_thermostat_va1167266816'' %}  {%set room_cur_temp      = state_attr(room_helper_entity, ''current_temperature'') | float %}  {%set room_target_temp   = state_attr(room_helper_entity, ''temperature'')         | float %}  {%set tado_cur_temp      = state_attr(tado_valve_entity,  ''current_temperature'') | float %}  {#diff = room_target_temp - room_cur_temp = tado_target_temp_nxt - tado_cur_temp #}{% set tado_target_temp_nxt = ((room_target_temp - room_cur_temp + tado_cur_temp) * 2) | float(22) | round / 2 %} {# round to 0.5 #}{%set tado_target_temp_nxt_sat = [[tado_target_temp_nxt, 25]|min,5]|max %} {# set lower and upper limit to [5,25] #}{{tado_target_temp_nxt_sat}}'
      target:
        entity_id: climate.tado_smart_radiator_thermostat_va1167266816
