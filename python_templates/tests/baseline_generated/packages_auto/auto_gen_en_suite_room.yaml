            entity_id:
            - light.en_suite_room_bed_led
            - light.en_suite_room_lamp_1
            - light.en_suite_room_lamp_2
            - light.en_suite_room_ceiling_light
            state: 'on'
            match: any
          then:
            alias: Turn light.en_suite_room_bed_led light.en_suite_room_lamp_1 light.en_suite_room_lamp_2 light.en_suite_room_ceiling_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
