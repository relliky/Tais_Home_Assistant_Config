              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.en_suite_room state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: heat
                  entity_id: climate.en_suite_room
              - alias: Turn switch.schedule_en_suite_room_temperature state=on
                if:
                - '{{ 1 == 1 }}'
