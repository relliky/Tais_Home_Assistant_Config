          else:
            alias: Turn light.en_suite_room_bed_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_room_bed_led
    - conditions:
        condition: trigger
        id: CYCLE_LEDS
      sequence:
      - alias: Turn light.en_suite_room_bed_led state=cycle_led
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id:
            - light.en_suite_room_bed_led
            state: 'off'
          then:
          - service: light.turn_on
            entity_id:
            - light.en_suite_room_bed_led
            data:
              brightness: 3
          - delay:
              milliseconds: 1000
          - if:
              condition: state
              entity_id:
              - light.en_suite_room_bed_led
              state: 'off'
            then:
            - service: light.turn_on
              entity_id:
              - light.en_suite_room_bed_led
              data:
                brightness: 3
          else:
            service: light.turn_on
            entity_id:
            - light.en_suite_room_bed_led
            data_template:
              brightness: '{% set brightness = state_attr(''light.en_suite_room_bed_led'', ''brightness'') | int(0) %}{% if brightness == 0 or is_state(''light.en_suite_room_bed_led'', ''off'') %}3{% elif brightness <= 83 %}84{% elif brightness <= 167 %}168{% elif brightness <= 254 %}255{% else %}0{% endif %}'
    - conditions:
        condition: trigger
        id: INCREMENT_LEDS
      sequence:
      - alias: Turn light.en_suite_room_bed_led state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: increment brightness unless it is off, set the brightness to 1 percent
            condition: state
            entity_id:
            - light.en_suite_room_bed_led
            state: 'off'
          then:
          - alias: Turn light.en_suite_room_bed_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_room_bed_led
          else:
            service: light.turn_on
            target:
              entity_id:
              - light.en_suite_room_bed_led
            data:
              brightness_step_pct: 34
    - conditions:
        condition: trigger
        id: DECREMENT_LEDS
      sequence:
      - alias: Turn light.en_suite_room_bed_led state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: increment brightness unless it is off, set the brightness to 1 percent
            condition: state
            entity_id:
            - light.en_suite_room_bed_led
            state: 'off'
          then:
          - alias: Turn light.en_suite_room_bed_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.en_suite_room_bed_led
          else:
            service: light.turn_on
            target:
              entity_id:
              - light.en_suite_room_bed_led
            data:
              brightness_step_pct: -34
    - conditions:
        condition: trigger
        id: TOGGLE_HEATING
      sequence:
      - alias: Turn heating state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id: climate.en_suite_room
            state: 'off'
          then:
            alias: Turn heating state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
