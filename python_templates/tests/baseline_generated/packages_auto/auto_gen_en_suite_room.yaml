    to:
    - '1'
    - single
    - single_left
    - single_right
    - single_center
    - button_1_single
    - button_2_single
    - button_3_single
  action:
  - alias: Turn light.en_suite_room_ceiling_light state=toggle
    if:
    - '{{ 1 == 1 }}'
    then:
      if:
      - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
        condition: state
        entity_id:
        - light.en_suite_room_ceiling_light
        state: 'on'
        match: any
      then:
        alias: Turn light.en_suite_room_ceiling_light state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_off
          entity_id:
          - light.en_suite_room_ceiling_light
      else:
        alias: Turn light.en_suite_room_ceiling_light state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: light.turn_on
          entity_id:
          - light.en_suite_room_ceiling_light
  id: automation.zlb_er_wall_switch_single_press_toggle_ceiling_light_en_suite_room
- alias: ZLB-ER Wall Switch - Double Click - Leave Room and Turn Off Everything-En-suite Room
  trigger:
  - platform: state
    entity_id:
    - sensor.en_suite_room_wall_button
    - sensor.en_suite_room_wall_button_2
    to:
    - '2'
    - double
    - double_left
    - double_right
    - double_center
    - button_1_double
    - button_2_double
    - button_3_double
  action:
  - service: automation.trigger
    entity_id:
    - automation.zl_er_lights_off_if_no_person_en_suite_room
    - automation.zh_er_heating_schedule_off_if_people_left_the_room_en_suite_room
  - service: input_select.select_option
    target:
      entity_id: input_select.en_suite_room_occupancy
    data:
      option: Outside
  id: automation.zlb_er_wall_switch_double_click_leave_room_and_turn_off_everything_en_suite_room
- alias: ZOc-ER Occupancy Update-En-suite Room
  id: automation.zoc_er_occupancy_update_en_suite_room
  trigger:
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'on'
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 150
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'on'
    for:
      seconds: 1800
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'off'
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 120
  - entity_id: group.en_suite_room_motion_group
    platform: state
    to: 'off'
    for:
      seconds: 180
  - trigger: homeassistant
    event: start
  - minutes: /3
    seconds: '57'
    trigger: time_pattern
  action:
  - choose:
    - alias: Outside -> Just Entered when motion is on
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Outside
      - condition: state
        entity_id: group.en_suite_room_motion_group
        state: 'on'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Just Entered
    - alias: Outside -> Outside when motion is not on
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Outside
      - condition: template
        value_template: '{{ not is_state(''group.en_suite_room_motion_group'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Stayed Inside when motion stays on
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.en_suite_room_motion_group'', ''on'') and (as_timestamp(now()) - as_timestamp(states[''group.en_suite_room_motion_group''].last_changed)) >= 150 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Stayed Inside
    - alias: Just Entered -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Just Entered
      - condition: template
        value_template: '{{ is_state(''group.en_suite_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.en_suite_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Outside
    - alias: Just Entered -> Just Entered by default
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Just Entered
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Just Entered
    - alias: Stayed Inside -> In Sleep when sleep time and stayed long enough
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Stayed Inside
      - condition: state
        entity_id: input_boolean.en_suite_room_sleep_time
        state: 'on'
      - condition: template
        value_template: '{{ is_state(''input_select.en_suite_room_occupancy'', ''Stayed Inside'') and (as_timestamp(now()) - as_timestamp(states[''input_select.en_suite_room_occupancy''].last_changed)) > 1800 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: In Sleep
    - alias: Stayed Inside -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Stayed Inside
      - condition: template
        value_template: '{{ is_state(''group.en_suite_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.en_suite_room_motion_group''].last_changed)) >= 120 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Outside
    - alias: Stayed Inside -> Stayed Inside by default
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: Stayed Inside
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Stayed Inside when sleep time ends
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ not is_state(''input_boolean.en_suite_room_sleep_time'', ''on'') }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Stayed Inside
    - alias: In Sleep -> Outside when motion stays off
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: In Sleep
      - condition: template
        value_template: '{{ is_state(''group.en_suite_room_motion_group'', ''off'') and (as_timestamp(now()) - as_timestamp(states[''group.en_suite_room_motion_group''].last_changed)) > 180 }}'
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Outside
    - alias: In Sleep -> In Sleep by default
      conditions:
      - condition: state
        entity_id: input_select.en_suite_room_occupancy
        state: In Sleep
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: In Sleep
    default:
    - service: script.do_nothing
- alias: ZOc-ER Occupancy Override and sync to Timer-En-suite Room
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.en_suite_room_auto_off_suspended
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.en_suite_room_auto_off_suspended
        state: 'on'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.en_suite_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_er_occupancy_update_en_suite_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: automation.zoc_er_occupancy_update_en_suite_room
      - service: input_select.select_option
        target:
          entity_id: input_select.en_suite_room_occupancy
        data:
          option: Stayed Inside
    - conditions:
      - condition: state
        entity_id: input_boolean.en_suite_room_auto_off_suspended
        state: 'off'
      sequence:
      - service: timer.cancel
        target:
          entity_id: timer.en_suite_room_auto_off_suspended_timer
      - alias: Turn automation.zoc_er_occupancy_update_en_suite_room state=on
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_on
          entity_id: automation.zoc_er_occupancy_update_en_suite_room
  id: automation.zoc_er_occupancy_override_and_sync_to_timer_en_suite_room
- alias: ZOc-ER Occupancy Override Sync from Timer-En-suite Room
  mode: single
  trigger:
  - platform: state
    entity_id: timer.en_suite_room_auto_off_suspended_timer
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '34'
    trigger: time_pattern
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: timer.en_suite_room_auto_off_suspended_timer
        state: active
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.en_suite_room_auto_off_suspended
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: timer.en_suite_room_auto_off_suspended_timer
          state: paused
        - condition: state
          entity_id: timer.en_suite_room_auto_off_suspended_timer
          state: idle
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.en_suite_room_auto_off_suspended
  id: automation.zoc_er_occupancy_override_sync_from_timer_en_suite_room
