                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.en_suite_room_curtain
                  - if:
                      condition: numeric_state
                      entity_id:
                      - cover.en_suite_room_curtain
                      attribute: current_position
                      below: 5
                    then:
                      service: cover.open_cover
                      entity_id:
                      - cover.en_suite_room_curtain
              else:
