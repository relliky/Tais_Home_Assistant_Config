    to: Outside
    for: 00:03:00
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '21'
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.en_suite_room_occupancy
    state: Outside
