- alias: ZLB-ER Single Button Control-En-suite Room
  trigger:
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - single
    - '1'
    id: CYCLE_SCENES
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - double
    - '2'
    id: TOGGLE_CURTAINS
  - platform: state
    entity_id: sensor.en_suite_room_button
    to:
    - hold
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - triple
    - '3'
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - quadruple
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - many
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.en_suite_room_button
    to:
    - release
    id: DO_NOTHING
  mode: queued
  action:
    choose:
    - conditions:
        condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.en_suite_room_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_room_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_room_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_room_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_room_scene
              scene: LED White
        - conditions:
            condition: state
            entity_id: input_select.en_suite_room_scene
            state: LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.en_suite_room_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.en_suite_room_scene
            scene: All White
    - conditions:
        condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_room state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_en_suite_room
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_room state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: switch.adaptive_lighting_sleep_mode_en_suite_room
          else:
            alias: Turn switch.adaptive_lighting_sleep_mode_en_suite_room state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: switch.adaptive_lighting_sleep_mode_en_suite_room
    - conditions:
        condition: trigger
        id: TOGGLE_CURTAINS
      sequence:
      - alias: Turn cover.en_suite_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id:
            - cover.en_suite_room_curtain
          - if:
            - alias: 'toggle all curtains together: if any of curtains is on, turn off all curtains, otherwise turn on all curtains'
              condition: state
              entity_id:
              - cover.en_suite_room_curtain
              state:
              - open
              - opening
              match: any
            then:
              alias: Turn cover.en_suite_room_curtain state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.en_suite_room_curtain
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.en_suite_room_curtain
                    attribute: current_position
                    above: 95
                  then:
                    service: cover.close_cover
                    entity_id:
                    - cover.en_suite_room_curtain
            else:
              alias: Turn cover.en_suite_room_curtain state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.en_suite_room_curtain
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.en_suite_room_curtain
                    attribute: current_position
                    below: 5
                  then:
                    service: cover.open_cover
                    entity_id:
                    - cover.en_suite_room_curtain
    - conditions:
        condition: trigger
        id: TOGGLE_CURTAIN_0
      sequence:
      - alias: Turn cover.en_suite_room_curtain state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: cover.en_suite_room_curtain
            state: 'on'
            match: any
          then:
            alias: Turn cover.en_suite_room_curtain state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id: cover.en_suite_room_curtain
          else:
            alias: Turn cover.en_suite_room_curtain state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id: cover.en_suite_room_curtain
    - conditions:
        condition: trigger
        id: INCREMENT_CURTAINS
      sequence:
      - alias: Turn cover.en_suite_room_curtain state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id:
            - cover.en_suite_room_curtain
          - service: cover.set_cover_position
            target:
              entity_id:
              - cover.en_suite_room_curtain
            data:
              position: '{{ [[ (state_attr(''cover.en_suite_room_curtain'', ''current_position'')) + 51 ,0]|max,100]|min}}'
    - conditions:
        condition: trigger
        id: DECREMENT_CURTAINS
      sequence:
      - alias: Turn cover.en_suite_room_curtain state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          alias: ''
          if:
          - '{{ 1 == 1 }}'
          then:
          - service: cover.stop_cover
            entity_id:
            - cover.en_suite_room_curtain
          - service: cover.set_cover_position
            target:
              entity_id:
              - cover.en_suite_room_curtain
            data:
              position: '{{ [[ (state_attr(''cover.en_suite_room_curtain'', ''current_position'')) + -51 ,0]|max,100]|min}}'
    - conditions:
        condition: trigger
        id: INCREMENT_CURTAIN_0
      sequence:
