            state: 'off'
          then:
            alias: Turn heating state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.living_room state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: heat
                  entity_id: climate.living_room
              - alias: Turn switch.schedule_living_room_temperature state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_on
                  entity_id: switch.schedule_living_room_temperature
          else:
            alias: Turn heating state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.living_room state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: 'off'
                  entity_id: climate.living_room
              - alias: Turn switch.schedule_living_room_temperature state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id: switch.schedule_living_room_temperature
    - conditions:
        condition: trigger
        id: INCREMENT_HEATING
      sequence:
      - alias: Turn heating state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.living_room
          data:
            temperature: '{{ (state_attr(''climate.living_room'', ''temperature'')) + 1}}'
    - conditions:
        condition: trigger
        id: DECREMENT_HEATING
      sequence:
      - alias: Turn heating state=decrement
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
          target:
            entity_id: climate.living_room
          data:
            temperature: '{{ (state_attr(''climate.living_room'', ''temperature'')) + -1}}'
