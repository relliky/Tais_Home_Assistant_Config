  id: automation.zlb_lr_6_key_button_remote_living_room
- alias: ZL-LR Curtain States When No Person Present-Living Room
  id: automation.zl_lr_curtain_states_when_no_person_present_living_room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    to: Outside
    for: 00:03:00
  - trigger: homeassistant
    event: start
  - minutes: /10
    seconds: '25'
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.living_room_occupancy
    state: Outside
    for: 00:03:00
  action:
  - alias: If it is intense light summer
    if:
    - condition: template
      value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_intense_light_summer_living_room'') | float(0) }}'
    - condition: numeric_state
      entity_id: sensor.met_office_cambridge_city_airport_temperature_3_hourly
      above: '15'
    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_living_room
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_living_room
              state: 'on'
            then:
              alias: Turn cover.living_room_curtain_1 cover.living_room_curtain_2 state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.living_room_curtain_1
                  - cover.living_room_curtain_2
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
                    attribute: current_position
                    below: 5
                  then:
                    service: cover.open_cover
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
            else:
              alias: Turn cover.living_room_curtain_1 cover.living_room_curtain_2 state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.living_room_curtain_1
                  - cover.living_room_curtain_2
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
                    attribute: current_position
                    above: 95
                  then:
                    service: cover.close_cover
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
    else:
      alias: If it is moderate light outdoor
      if:
      - condition: template
        value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_moderate_light_outdoor_living_room'') | float(0) }}'
      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_living_room
        state: 'off'
      then:
        alias: curtain states when moderate light outdoor
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_moderate_light_outdoor_living_room
                state: 'on'
              then:
                alias: Turn cover.living_room_curtain_1 cover.living_room_curtain_2 state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
                  - if:
                      condition: numeric_state
                      entity_id:
                      - cover.living_room_curtain_1
                      - cover.living_room_curtain_2
                      attribute: current_position
                      below: 5
                    then:
                      service: cover.open_cover
                      entity_id:
                      - cover.living_room_curtain_1
                      - cover.living_room_curtain_2
              else:
                alias: Turn cover.living_room_curtain_1 cover.living_room_curtain_2 state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.living_room_curtain_1
                    - cover.living_room_curtain_2
                  - if:
                      condition: numeric_state
                      entity_id:
                      - cover.living_room_curtain_1
                      - cover.living_room_curtain_2
                      attribute: current_position
                      above: 95
                    then:
                      service: cover.close_cover
                      entity_id:
                      - cover.living_room_curtain_1
                      - cover.living_room_curtain_2
      else:
        alias: If it is low light outdoor
        if:
        - condition: template
          value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) <= states(''input_number.intensity_threshold_moderate_light_outdoor_living_room'') | float(0) }}'
        - condition: state
          entity_id: switch.adaptive_lighting_sleep_mode_living_room
          state: 'off'
        then:
          alias: curtain states when low light outdoor
          if:
