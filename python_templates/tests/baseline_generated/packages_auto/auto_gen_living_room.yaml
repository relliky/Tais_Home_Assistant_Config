    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_living_room
      state: 'off'
    then:
      alias: light states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.ceiling_light_control_intense_light_summer_living_room
