      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_living_room
        state: 'off'
      then:
        alias: light states when moderate light outdoor
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.ceiling_light_control_moderate_light_outdoor_living_room
                state: 'on'
              then:
                alias: Turn light.living_room_ceiling_light state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_on
                  entity_id:
                  - light.living_room_ceiling_light
              else:
                alias: Turn light.living_room_ceiling_light state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_off
                  entity_id:
                  - light.living_room_ceiling_light
            - if:
                condition: state
                entity_id: input_boolean.lamp_control_moderate_light_outdoor_living_room
                state: 'on'
              then:
                alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_on
                  entity_id:
                  - light.living_room_floor_light_1
                  - light.living_room_floor_light_2
              else:
                alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: light.turn_off
                  entity_id:
                  - light.living_room_floor_light_1
