          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.ceiling_light_control_low_light_outdoor_living_room
                  state: 'on'
                then:
                  alias: Turn light.living_room_ceiling_light state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: light.turn_on
                    entity_id:
                    - light.living_room_ceiling_light
                else:
                  alias: Turn light.living_room_ceiling_light state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: light.turn_off
                    entity_id:
                    - light.living_room_ceiling_light
              - if:
                  condition: state
                  entity_id: input_boolean.lamp_control_low_light_outdoor_living_room
                  state: 'on'
                then:
                  alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: light.turn_on
                    entity_id:
                    - light.living_room_floor_light_1
                    - light.living_room_floor_light_2
                else:
                  alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: light.turn_off
                    entity_id:
                    - light.living_room_floor_light_1
                    - light.living_room_floor_light_2
              - if:
                  condition: state
                  entity_id: input_boolean.led_control_low_light_outdoor_living_room
                  state: 'on'
                then:
                  alias: Turn switch.living_room_floor_light_3 state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_on
                    entity_id:
                    - switch.living_room_floor_light_3
                else:
                  alias: Turn switch.living_room_floor_light_3 state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    service: homeassistant.turn_off
                    entity_id:
                    - switch.living_room_floor_light_3
        else:
          alias: If it is bright afternoon
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_living_room
            state: 'on'
          then:
            alias: light states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.ceiling_light_control_sleep_mode_living_room
                    state: 'on'
                  then:
                    alias: Turn light.living_room_ceiling_light state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_on
                      entity_id:
                      - light.living_room_ceiling_light
                  else:
                    alias: Turn light.living_room_ceiling_light state=off
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_off
                      entity_id:
                      - light.living_room_ceiling_light
                - if:
                    condition: state
                    entity_id: input_boolean.lamp_control_sleep_mode_living_room
                    state: 'on'
                  then:
                    alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      service: light.turn_on
                      entity_id:
