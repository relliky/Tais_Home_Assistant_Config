  - service: automation.trigger
    entity_id: automation.zl_lr_curtain_states_when_no_person_present_living_room
- alias: ZL-LR Lights Off If No Person-Living Room
  id: automation.zl_lr_lights_off_if_no_person_living_room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    to: Outside
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '57'
    trigger: time_pattern
  condition:
  - condition: state
    entity_id: input_select.living_room_occupancy
    state: Outside
  - condition: state
    entity_id: group.living_room_motion_group
    state: 'off'
    for: 00:01:00
  action:
    parallel:
    - alias: Turn automation.zl_lr_lights_on_if_entering_to_room_living_room state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        service: homeassistant.turn_on
        entity_id: automation.zl_lr_lights_on_if_entering_to_room_living_room
    - alias: Turn media_player.living_room_tv state=off
      if:
      - '{{ 1 == 1 }}'
      then:
        service: homeassistant.turn_off
        entity_id:
        - media_player.living_room_tv
    - service: script.call_room_scene
      data:
        room_scene_select: input_select.living_room_scene
        scene: Idle
    - alias: All Off
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - alias: Turn light.living_room_ceiling_light state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: light.turn_off
            entity_id:
            - light.living_room_ceiling_light
        - alias: Turn light.living_room_floor_light_1 light.living_room_floor_light_2 state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: light.turn_off
            entity_id:
            - light.living_room_floor_light_1
            - light.living_room_floor_light_2
        - alias: Turn switch.living_room_floor_light_3 state=off
          if:
          - '{{ 1 == 1 }}'
          then:
            service: homeassistant.turn_off
            entity_id:
            - switch.living_room_floor_light_3
        - alias: Turn media_player.living_room_tv
          if:
          - '{{ 1 == 1 }}'
          then:
            if:
            - alias: Set TV brightness when it is on
              condition: state
              entity_id:
              - media_player.living_room_tv
              state: 'on'
            then:
              service: input_select.select_option
              data:
                entity_id:
                - input_select.living_room_tv_picture_mode
                option: Standard
    - service: script.do_nothing
- alias: ZL-LR Disable Entering Lights-on Automation If any People are in the Room-Living Room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    to:
    - Just Entered
    - In Sleep
    - Stayed Inside
  action:
  - delay: 00:00:10
  - service: automation.turn_off
    entity_id: automation.zl_lr_lights_on_if_entering_to_room_living_room
    data:
      stop_actions: 'false'
  id: automation.zl_lr_disable_entering_lights_on_automation_if_any_people_are_in_the_room_living_room
- alias: ZH-LR Heating Schedule On If Staying In the Room-Living Room
  id: automation.zh_lr_heating_schedule_on_if_staying_in_the_room_living_room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    from:
    - Just Entered
    - Outside
    to:
    - Stayed Inside
    - In Sleep
  action:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.living_room
        state: heat
    then:
      alias: Turn heating state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        alias: ''
        if:
        - '{{ 1 == 1 }}'
        then:
        - alias: Turn climate.living_room state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: climate.set_hvac_mode
            data:
              hvac_mode: heat
            entity_id: climate.living_room
        - alias: Turn switch.schedule_living_room_temperature state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: homeassistant.turn_on
            entity_id: switch.schedule_living_room_temperature
- alias: ZH-LR Heating Schedule Off If People Left the Room-Living Room
  id: automation.zh_lr_heating_schedule_off_if_people_left_the_room_living_room
  trigger:
  - platform: state
    entity_id: input_select.living_room_occupancy
    to: Outside
  - trigger: homeassistant
    event: start
  - minutes: /30
    seconds: '13'
    trigger: time_pattern
  action:
  - condition: state
    entity_id: input_select.living_room_occupancy
    state: Outside
  - service: script.do_nothing
  - condition: state
    entity_id: input_boolean.living_room_heating_override
    state: 'off'
  - alias: Turn heating state=off
    if:
    - '{{ 1 == 1 }}'
    then:
      alias: ''
      if:
      - '{{ 1 == 1 }}'
      then:
      - alias: Turn climate.living_room state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_hvac_mode
          data:
            hvac_mode: 'off'
          entity_id: climate.living_room
      - alias: Turn switch.schedule_living_room_temperature state=off
        if:
        - '{{ 1 == 1 }}'
        then:
          service: homeassistant.turn_off
          entity_id: switch.schedule_living_room_temperature
- alias: ZH-LR Heating Manual Override-Living Room
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.living_room_heating_override
  action:
  - if:
    - condition: state
      entity_id: input_boolean.living_room_heating_override
      state: 'off'
    then:
    - service: automation.trigger
      entity_id:
      - automation.zh_lr_heating_schedule_off_if_people_left_the_room_living_room
    else:
    - service: automation.trigger
      entity_id:
      - automation.zh_lr_heating_schedule_on_if_staying_in_the_room_living_room
    - delay:
        hours: 4
    - service: homeassistant.turn_off
      entity_id: input_boolean.living_room_heating_override
    - service: automation.trigger
      entity_id:
      - automation.zh_lr_heating_schedule_on_if_staying_in_the_room_living_room
  id: automation.zh_lr_heating_manual_override_living_room
- alias: ZLB-LR Single Button Control-Living Room
  trigger:
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - single
    - '1'
    id: CYCLE_SCENES
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - double
    - '2'
    id: TOGGLE_CURTAINS
  - platform: state
    entity_id: sensor.living_room_button
    to:
    - hold
    id: TOGGLE_LAMP_0
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - triple
    - '3'
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - quadruple
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - many
    id: DO_NOTHING
  - platform: state
    entity_id:
    - sensor.living_room_button
    to:
    - release
    id: DO_NOTHING
  mode: queued
  action:
    choose:
    - conditions:
        condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.living_room_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.living_room_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.living_room_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.living_room_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.living_room_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.living_room_scene
              scene: Hue
        - conditions:
            condition: state
            entity_id: input_select.living_room_scene
            state: Hue
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.living_room_scene
              scene: LED White
        - conditions:
            condition: state
            entity_id: input_select.living_room_scene
            state: LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.living_room_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.living_room_scene
            scene: All White
    - conditions:
        condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_living_room state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_living_room
            state: 'on'
            match: any
          then:
            alias: Turn switch.adaptive_lighting_sleep_mode_living_room state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
