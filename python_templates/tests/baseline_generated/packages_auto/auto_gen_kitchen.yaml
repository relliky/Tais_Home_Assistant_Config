    entity_id: input_select.kitchen_occupancy
    from:
    - Just Entered
    - Outside
    to:
    - Stayed Inside
    - In Sleep
  action:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.kitchen
        state: heat
    then:
      alias: Turn heating state=on
      if:
      - '{{ 1 == 1 }}'
      then:
        alias: ''
        if:
        - '{{ 1 == 1 }}'
        then:
        - alias: Turn climate.kitchen state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: climate.set_hvac_mode
            data:
              hvac_mode: heat
            entity_id: climate.kitchen
        - alias: Turn switch.schedule_kitchen_temperature state=on
          if:
          - '{{ 1 == 1 }}'
          then:
            service: homeassistant.turn_on
            entity_id: switch.schedule_kitchen_temperature
- alias: ZH-KC Heating Schedule Off If People Left the Room-Kitchen
  id: automation.zh_kc_heating_schedule_off_if_people_left_the_room_kitchen
  trigger:
