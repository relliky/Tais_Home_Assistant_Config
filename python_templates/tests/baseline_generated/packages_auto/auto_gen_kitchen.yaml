    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_kitchen
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_kitchen
              state: 'on'
            then:
              alias: Turn cover.kitchen_curtain state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
