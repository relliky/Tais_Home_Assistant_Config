template:
- sensor:
  - name: Front Door Lock Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.front_door_lock_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Front Door Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.front_door_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Temperature Sensor
    unit_of_measurement: "\xB0C"
    state: '{{states.sensor["582d34828f85_temperature"].state | float(22) | round(1)}}'
- sensor:
  - name: Kitchen Temperature Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_temperature_sensor_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Humidity Sensor
    unit_of_measurement: '%'
    state: '{{states.sensor["582d34828f85_humidity"].state | float(40) | round(1)}}'
- sensor:
  - name: Kitchen Extractor Wall Button
    state: '{{states.sensor["0x00158d0005210fa9_action"].state}}'
- sensor:
  - name: Kitchen Wall Button
    state: '{{states.sensor["0x04cf8cdf3c7ad647_action"].state}}'
- binary_sensor:
  - name: Rice Cooker Power
    state: '{% if states("sensor.smart_switch_24110804769064510803c4e7ae0ff809_power_smoothed") | float(0) | round(1) > 10 %} on {% else %} off {% endif %}'
    delay_off:
      minutes: 0
- binary_sensor:
  - name: Plate Warmer Power
    state: '{% if states("sensor.smart_switch_24110805022128510803c4e7ae0ffcf7_power") | float(0) | round(1) > 10 %} on {% else %} off {% endif %}'
    delay_off:
      minutes: 0
- binary_sensor:
  - name: Baby Food Cooker Power
    state: '{% if states("sensor.0x00158d000171756e_power") | float(0) | round(1) > 5 %} on {% else %} off {% endif %}'
    delay_off:
      minutes: 3
- binary_sensor:
  - name: Washing Machine Power
    state: '{% if states("sensor.smart_plug_20030678930061251h3448e1e91852b1_power_smoothed") | float(0) | round(1) > 10 %} on {% else %} off {% endif %}'
    delay_off:
      minutes: 0
- binary_sensor:
  - name: Dish Washer Power
    state: '{% if states("sensor.smart_plug_20030602740631251h3448e1e918560a_power_smoothed") | float(0) | round(1) > 5 %} on {% else %} off {% endif %}'
    delay_off:
      minutes: 0
- sensor:
  - name: Kitchen Dining Motion Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_dining_motion_sensor_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Worktop Motion Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_worktop_motion_sensor_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- binary_sensor:
  - name: Kitchen Table Occupancy Sensor Occupancy
    state: '{% if states.sensor["a4c1387f7df0_no_one_duration"].state == ''unavailable'' or states.sensor["a4c1387f7df0_no_one_duration"].state  == ''unknown''%}

      {{states.binary_sensor["a4c1387f7df0_occupancy"].state}}

      {% elif states.sensor["a4c1387f7df0_no_one_duration"].state == ''0'' %}

      {{states.binary_sensor["a4c1387f7df0_occupancy"].state}}

      {# else is equivilence to elif states.sensor["a4c1387f7df0_no_one_duration"].state > "0" #}

      {% else %}

      off

      {% endif %}

      '
    device_class: occupancy
- sensor:
  - name: Kitchen Table Occupancy Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_table_occupancy_sensor_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Window Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_window_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Water Leak Sensor Battery
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    state: '{% set s = states(''sensor.kitchen_water_leak_sensor_battery_median'') %}{{ s | int if s not in [''unknown'', ''unavailable'', ''''] else ''unknown'' }}'
- sensor:
  - name: Kitchen Tado Availiabity
    unit_of_measurement: "\xB0C"
    state: '{{states("sensor.tado_smart_radiator_thermostat_va3767669760_current_temperature") | float(22) | round(1)}}'
- binary_sensor:
  - name: Kitchen Heating Required
    state: '{% set climate = "climate.tado_smart_radiator_thermostat_va3767669760" %}{% if states(climate) == "unavailable" or states(climate) == "off" or (state_attr(climate, "temperature") <= state_attr(climate, "current_temperature"))  %}off{% else %} on{% endif %}'
- binary_sensor:
  - name: Kitchen Unavailable Entities
    state: '{% set added_device_entities =  [''sensor.front_door_lock_battery'', ''sensor.front_door_battery'', ''sensor.kitchen_temperature_sensor'', ''sensor.kitchen_temperature_sensor_battery'', ''sensor.kitchen_humidity_sensor'', ''sensor.kitchen_extractor_wall_button'', ''sensor.kitchen_wall_button'', ''binary_sensor.rice_cooker_power'', ''binary_sensor.plate_warmer_power'', ''binary_sensor.baby_food_cooker_power'', ''binary_sensor.washing_machine_power'', ''binary_sensor.dish_washer_power'', ''sensor.kitchen_dining_motion_sensor_battery'', ''sensor.kitchen_worktop_motion_sensor_battery'', ''binary_sensor.kitchen_table_occupancy_sensor_occupancy'', ''sensor.kitchen_table_occupancy_sensor_battery'', ''sensor.kitchen_window_battery'', ''sensor.kitchen_water_leak_sensor_battery'', ''sensor.kitchen_tado_availiabity'', ''binary_sensor.kitchen_heating_required'', ''binary_sensor.front_door'', ''binary_sensor.kitchen_dining_motion_sensor_motion'', ''binary_sensor.kitchen_worktop_motion_sensor_motion'', ''binary_sensor.kitchen_window'', ''binary_sensor.kitchen_water_leak_sensor'', ''switch.kitchen_extractor_wall_switch_1'', ''switch.kitchen_extractor_wall_switch_2'', ''switch.kitchen_extractor'', ''switch.kitchen_wall_switch_1'', ''switch.kitchen_wall_switch_2'', ''switch.kitchen_wall_switch_3'', ''switch.kitchen_floor_led'', ''switch.rice_cooker_switch'', ''switch.plate_warmer_switch'', ''switch.baby_food_cooker_switch'', ''cover.kitchen_curtain'', ''lock.front_door'', ''light.kitchen_ceiling_light'', ''light.kitchen_dining_light'', ''light.kitchen_worktop_led''] %}{% set ns = namespace() %}{% set ns.num_unavail_devices = 0 %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}      {% set ns.num_unavail_devices = ns.num_unavail_devices + 1 %}   {% endif %}{% endfor %}{% if ns.num_unavail_devices > 0%}  on  {% else %}  off {% endif %}'
    attributes:
      value: '{% set added_device_entities =  [''sensor.front_door_lock_battery'', ''sensor.front_door_battery'', ''sensor.kitchen_temperature_sensor'', ''sensor.kitchen_temperature_sensor_battery'', ''sensor.kitchen_humidity_sensor'', ''sensor.kitchen_extractor_wall_button'', ''sensor.kitchen_wall_button'', ''binary_sensor.rice_cooker_power'', ''binary_sensor.plate_warmer_power'', ''binary_sensor.baby_food_cooker_power'', ''binary_sensor.washing_machine_power'', ''binary_sensor.dish_washer_power'', ''sensor.kitchen_dining_motion_sensor_battery'', ''sensor.kitchen_worktop_motion_sensor_battery'', ''binary_sensor.kitchen_table_occupancy_sensor_occupancy'', ''sensor.kitchen_table_occupancy_sensor_battery'', ''sensor.kitchen_window_battery'', ''sensor.kitchen_water_leak_sensor_battery'', ''sensor.kitchen_tado_availiabity'', ''binary_sensor.kitchen_heating_required'', ''binary_sensor.front_door'', ''binary_sensor.kitchen_dining_motion_sensor_motion'', ''binary_sensor.kitchen_worktop_motion_sensor_motion'', ''binary_sensor.kitchen_window'', ''binary_sensor.kitchen_water_leak_sensor'', ''switch.kitchen_extractor_wall_switch_1'', ''switch.kitchen_extractor_wall_switch_2'', ''switch.kitchen_extractor'', ''switch.kitchen_wall_switch_1'', ''switch.kitchen_wall_switch_2'', ''switch.kitchen_wall_switch_3'', ''switch.kitchen_floor_led'', ''switch.rice_cooker_switch'', ''switch.plate_warmer_switch'', ''switch.baby_food_cooker_switch'', ''cover.kitchen_curtain'', ''lock.front_door'', ''light.kitchen_ceiling_light'', ''light.kitchen_dining_light'', ''light.kitchen_worktop_led''] %}{% set ns = namespace() %}{% set ns.unavail_devices = '''' %}{% for device in added_device_entities %}   {% if states(device) in [''unavailable'', ''unknown'', ''none''] %}   {% set ns.unavail_devices = ns.unavail_devices + ''

        '' +device %} {% endif %}{% endfor %}{{ns.unavail_devices}}'
- binary_sensor:
  - name: Kitchen Low Battery
    state: '{% set state = states("sensor.kitchen_min_battery") %} {% if state == "unavailable" or state == "unknown" or int(state) > 20 %} off {% else%} on {% endif %}'
