- alias: ZH-KC Heating Manual Override-Kitchen
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.kitchen_heating_override
  action:
  - if:
    - condition: state
      entity_id: input_boolean.kitchen_heating_override
      state: 'off'
    then:
    - service: automation.trigger
      entity_id:
      - automation.zh_kc_heating_schedule_off_if_people_left_the_room_kitchen
    else:
    - service: automation.trigger
      entity_id:
      - automation.zh_kc_heating_schedule_on_if_staying_in_the_room_kitchen
    - delay:
        hours: 4
    - service: homeassistant.turn_off
      entity_id: input_boolean.kitchen_heating_override
    - service: automation.trigger
      entity_id:
      - automation.zh_kc_heating_schedule_on_if_staying_in_the_room_kitchen
  id: automation.zh_kc_heating_manual_override_kitchen
- alias: ZL-KC Applies Different Scenes Based on Scene Selections (State Execution)-Kitchen
  trigger:
  - platform: state
    entity_id: input_select.kitchen_scene
  mode: restart
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: All White
      sequence:
        alias: All White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: script.do_nothing
          - alias: Turn light.kitchen_ceiling_light light.kitchen_dining_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.kitchen_ceiling_light
              - light.kitchen_dining_light
          - alias: Turn switch.kitchen_floor_led light.kitchen_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.kitchen_floor_led
              - light.kitchen_tv_led
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Ceiling Light White
      sequence:
        alias: Ceiling Light White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: script.do_nothing
          - alias: Turn switch.kitchen_floor_led light.kitchen_tv_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.kitchen_floor_led
              - light.kitchen_tv_led
          - alias: Turn light.kitchen_ceiling_light light.kitchen_dining_light state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_on
              entity_id:
              - light.kitchen_ceiling_light
              - light.kitchen_dining_light
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Lamp LED White
      sequence:
        alias: Lamp LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.kitchen_ceiling_light light.kitchen_dining_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.kitchen_ceiling_light
              - light.kitchen_dining_light
          - service: script.do_nothing
          - alias: Turn switch.kitchen_floor_led light.kitchen_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.kitchen_floor_led
              - light.kitchen_tv_led
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: LED White
      sequence:
        alias: LED White
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn switch.kitchen_floor_led light.kitchen_tv_led state=on
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_on
              entity_id:
              - switch.kitchen_floor_led
              - light.kitchen_tv_led
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Hue
      sequence:
        alias: Hue
        if:
        - '{{ 1 == 1 }}'
        then:
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - light.kitchen_ceiling_light
            - light.kitchen_dining_light
            - switch.kitchen_floor_led
            - light.kitchen_tv_led
            state: 'off'
            rgb: non_rgb_only
        - service: pyscript.turn_rgb_light
          data:
            light_list:
            - light.kitchen_ceiling_light
            - light.kitchen_dining_light
            - switch.kitchen_floor_led
            - light.kitchen_tv_led
        - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Night Mode
      sequence:
        alias: Night Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.kitchen_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Dark Night Mode
      sequence:
        alias: Dark Night Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.kitchen_dark_night_mode
          - service: script.do_nothing
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: Sleep Mode
      sequence:
        alias: Sleep Mode
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - service: homeassistant.turn_on
            entity_id: scene.kitchen_sleep_mode
    - conditions:
      - condition: state
        entity_id: input_select.kitchen_scene
        state: All Off
      sequence:
        alias: All Off
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - alias: Turn light.kitchen_ceiling_light light.kitchen_dining_light state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: light.turn_off
              entity_id:
              - light.kitchen_ceiling_light
              - light.kitchen_dining_light
          - service: script.do_nothing
          - alias: Turn switch.kitchen_floor_led light.kitchen_tv_led state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              service: homeassistant.turn_off
              entity_id:
              - switch.kitchen_floor_led
              - light.kitchen_tv_led
          - service: script.do_nothing
  id: automation.zl_kc_applies_different_scenes_based_on_scene_selections_state_execution_kitchen
