  - platform: state
    entity_id: binary_sensor.study_desk_button_single_click
    to: 'on'
    id: TOGGLE_LEDS
  - platform: state
    entity_id: binary_sensor.study_desk_button_double_click
    to: 'on'
    id: TOGGLE_CEILING_LIGHTS
  - platform: state
    entity_id: binary_sensor.study_desk_button_long_press
    to: 'on'
    id: TOGGLE_CURTAINS
  mode: queued
  action:
    choose:
    - conditions:
        condition: trigger
        id: CYCLE_SCENES
      sequence:
        choose:
        - conditions:
            condition: state
            entity_id: input_select.study_scene
            state: All Off
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.study_scene
              scene: All White
        - conditions:
            condition: state
            entity_id: input_select.study_scene
            state: All White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.study_scene
              scene: Lamp LED White
        - conditions:
            condition: state
            entity_id: input_select.study_scene
            state: Lamp LED White
          sequence:
            service: script.call_room_scene
            data:
              room_scene_select: input_select.study_scene
              scene: All Off
        default:
          service: script.call_room_scene
          data:
            room_scene_select: input_select.study_scene
            scene: All White
    - conditions:
        condition: trigger
        id: DO_NOTHING
      sequence:
      - service: script.do_nothing
    - conditions:
        condition: trigger
        id: TOGGLE_AL_SLEEP_MODE
      sequence:
      - alias: Turn switch.adaptive_lighting_sleep_mode_study state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
