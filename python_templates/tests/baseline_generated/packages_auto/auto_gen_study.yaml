- alias: ZL-ST Curtain States When No Person Present-Study
  id: automation.zl_st_curtain_states_when_no_person_present_study
  trigger:
  - platform: state
    entity_id: input_select.study_occupancy
    to: Outside
    for: 00:03:00
  - trigger: homeassistant
