  - minutes: /10
    seconds: '31'
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.study_occupancy
    state: Outside
    for: 00:03:00
  action:
  - alias: If it is intense light summer
    if:
    - condition: template
      value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_intense_light_summer_study'') | float(0) }}'
    - condition: numeric_state
      entity_id: sensor.met_office_cambridge_city_airport_temperature_3_hourly
      above: '15'
    - condition: template
      value_template: '{{ now().month > 4 and now().month < 9 }}'
    - condition: state
      entity_id: switch.adaptive_lighting_sleep_mode_study
      state: 'off'
    then:
      alias: curtain states when intense light summer
      if:
      - '{{ 1 == 1 }}'
      then:
      - parallel:
        - parallel:
          - if:
              condition: state
              entity_id: input_boolean.curtain_control_intense_light_summer_study
              state: 'on'
            then:
              alias: Turn cover.study_blind state=on
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.study_blind
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.study_blind
                    attribute: current_position
                    above: 95
                  then:
                    service: cover.set_cover_position
                    data:
                      position: 100
                    entity_id:
                    - cover.study_blind
            else:
              alias: Turn cover.study_blind state=off
              if:
              - '{{ 1 == 1 }}'
              then:
                alias: ''
                if:
                - '{{ 1 == 1 }}'
                then:
                - service: cover.stop_cover
                  entity_id:
                  - cover.study_blind
                - if:
                    condition: numeric_state
                    entity_id:
                    - cover.study_blind
                    attribute: current_position
                    above: 2
                  then:
                    service: cover.set_cover_position
                    data:
                      position: 2
                    entity_id:
                    - cover.study_blind
    else:
      alias: If it is moderate light outdoor
      if:
      - condition: template
        value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) > states(''input_number.intensity_threshold_moderate_light_outdoor_study'') | float(0) }}'
      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_study
        state: 'off'
      then:
        alias: curtain states when moderate light outdoor
        if:
        - '{{ 1 == 1 }}'
        then:
        - parallel:
          - parallel:
            - if:
                condition: state
                entity_id: input_boolean.curtain_control_moderate_light_outdoor_study
                state: 'on'
              then:
                alias: Turn cover.study_blind state=on
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.study_blind
                  - if:
                      condition: numeric_state
                      entity_id:
                      - cover.study_blind
                      attribute: current_position
                      above: 95
                    then:
                      service: cover.set_cover_position
                      data:
                        position: 100
                      entity_id:
                      - cover.study_blind
              else:
                alias: Turn cover.study_blind state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  alias: ''
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                  - service: cover.stop_cover
                    entity_id:
                    - cover.study_blind
                  - if:
                      condition: numeric_state
                      entity_id:
                      - cover.study_blind
                      attribute: current_position
                      above: 2
                    then:
                      service: cover.set_cover_position
                      data:
                        position: 2
                      entity_id:
                      - cover.study_blind
      else:
        alias: If it is low light outdoor
        if:
        - condition: template
          value_template: '{{ states(''sensor.living_room_light_intensity'') | float(0) <= states(''input_number.intensity_threshold_moderate_light_outdoor_study'') | float(0) }}'
        - condition: state
          entity_id: switch.adaptive_lighting_sleep_mode_study
          state: 'off'
        then:
          alias: curtain states when low light outdoor
          if:
          - '{{ 1 == 1 }}'
          then:
          - parallel:
            - parallel:
              - if:
                  condition: state
                  entity_id: input_boolean.curtain_control_low_light_outdoor_study
                  state: 'on'
                then:
                  alias: Turn cover.study_blind state=on
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.study_blind
                    - if:
                        condition: numeric_state
                        entity_id:
                        - cover.study_blind
                        attribute: current_position
                        above: 95
                      then:
                        service: cover.set_cover_position
                        data:
                          position: 100
                        entity_id:
                        - cover.study_blind
                else:
                  alias: Turn cover.study_blind state=off
                  if:
                  - '{{ 1 == 1 }}'
                  then:
                    alias: ''
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                    - service: cover.stop_cover
                      entity_id:
                      - cover.study_blind
                    - if:
                        condition: numeric_state
                        entity_id:
                        - cover.study_blind
                        attribute: current_position
                        above: 2
                      then:
                        service: cover.set_cover_position
                        data:
                          position: 2
                        entity_id:
                        - cover.study_blind
        else:
          alias: If it is sleep mode
          if:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_study
            state: 'on'
          then:
            alias: curtain states when sleep mode
            if:
            - '{{ 1 == 1 }}'
            then:
            - parallel:
              - parallel:
                - if:
                    condition: state
                    entity_id: input_boolean.curtain_control_sleep_mode_study
                    state: 'on'
                  then:
                    alias: Turn cover.study_blind state=on
                    if:
                    - '{{ 1 == 1 }}'
                    then:
                      alias: ''
                      if:
                      - '{{ 1 == 1 }}'
                      then:
                      - service: cover.stop_cover
                        entity_id:
                        - cover.study_blind
                      - if:
                          condition: numeric_state
                          entity_id:
