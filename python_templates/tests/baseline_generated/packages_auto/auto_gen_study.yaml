          else:
            alias: Turn heating state=off
            if:
            - '{{ 1 == 1 }}'
            then:
              alias: ''
              if:
              - '{{ 1 == 1 }}'
              then:
              - alias: Turn climate.study state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: climate.set_hvac_mode
                  data:
                    hvac_mode: 'off'
                  entity_id: climate.study
              - alias: Turn switch.schedule_study_temperature state=off
                if:
                - '{{ 1 == 1 }}'
                then:
                  service: homeassistant.turn_off
                  entity_id: switch.schedule_study_temperature
    - conditions:
        condition: trigger
        id: INCREMENT_HEATING
      sequence:
      - alias: Turn heating state=increment
        if:
        - '{{ 1 == 1 }}'
        then:
          service: climate.set_temperature
