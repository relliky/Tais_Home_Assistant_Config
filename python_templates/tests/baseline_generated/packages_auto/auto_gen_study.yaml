              - light.ccb5d1ab99bd_light
              - light.ccb5d1ab3f31_light
              - light.ccb5d1ab63f6_light
              data:
                brightness_pct: 1
          else:
            service: light.turn_on
            target:
              entity_id:
              - light.ccb5d1ab99bd_light
              - light.ccb5d1ab3f31_light
              - light.ccb5d1ab63f6_light
            data:
              brightness_step_pct: -34
    - conditions:
        condition: trigger
        id: CYCLE_CEILING_LIGHTS
      sequence:
      - alias: Turn light.ccb5d1ab99bd_light light.ccb5d1ab3f31_light light.ccb5d1ab63f6_light state=cycle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
            condition: state
            entity_id:
            - light.ccb5d1ab99bd_light
            - light.ccb5d1ab3f31_light
            - light.ccb5d1ab63f6_light
            state: 'off'
          then:
          - service: light.turn_on
            entity_id:
            - light.ccb5d1ab99bd_light
            - light.ccb5d1ab3f31_light
            - light.ccb5d1ab63f6_light
            data:
              brightness: 3
          else:
            service: light.turn_on
            entity_id:
            - light.ccb5d1ab99bd_light
            - light.ccb5d1ab3f31_light
            - light.ccb5d1ab63f6_light
            data_template:
              brightness: '{% set brightness = state_attr(''light.ccb5d1ab99bd_light'', ''brightness'') | int(0) %}{% if brightness == 0 or is_state(''light.ccb5d1ab99bd_light'', ''off'') %}3{% elif brightness <= 83 %}84{% elif brightness <= 167 %}168{% elif brightness <= 254 %}255{% else %}0{% endif %}'
    - conditions:
        condition: trigger
        id: TOGGLE_LEDS
      sequence:
      - alias: Turn switch.study_screen_light state=toggle
        if:
        - '{{ 1 == 1 }}'
        then:
          if:
          - alias: 'toggle everything all together: if any entity is on, turn off all entities, otherwise turn on all entities'
            condition: state
            entity_id:
            - switch.study_screen_light
            state: 'on'
            match: any
          then:
            alias: Turn switch.study_screen_light state=off
            if:
